<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unjumble | Speak Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --black: #1a1a1a;
            --black-light: #2a2a2a;
            --orange: #ff6b35;
            --orange-dark: #e55a2b;
            --orange-light: #ff8c5a;
            --white: #ffffff;
            --gray-light: #f5f5f5;
            --gray: #e0e0e0;
            --gray-dark: #888;
            --success: #4caf50;
            --info: #3b82f6;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--black) 0%, var(--black-light) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: var(--white);
        }

        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 0.9rem; font-weight: 700; color: var(--orange); letter-spacing: 3px; text-transform: uppercase; }
        .game-title { font-size: 2rem; font-weight: 800; color: var(--white); }
        .set-title { font-size: 0.9rem; color: var(--gray-dark); margin-top: 5px; }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 600px;
        }

        .stat-box {
            background: var(--black-light);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .stat-box .value {
            font-family: 'JetBrains Mono', monospace;
            color: var(--orange);
            font-weight: 700;
        }

        .lives-container { display: flex; gap: 4px; }
        .heart { font-size: 1.2rem; transition: all 0.3s ease; }
        .heart.lost { opacity: 0.2; transform: scale(0.8); }

        .progress-container { width: 100%; max-width: 600px; margin-bottom: 20px; }
        .progress-bar { height: 10px; background: var(--black-light); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--orange), var(--orange-light)); border-radius: 10px; transition: width 0.5s ease; }
        .progress-text { text-align: center; margin-top: 6px; font-size: 0.85rem; color: var(--gray-dark); }

        .game-container {
            background: var(--white);
            border-radius: 24px;
            padding: 30px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            border: 4px solid var(--orange);
        }

        .stars-display { display: flex; justify-content: center; gap: 5px; margin-bottom: 15px; }
        .star { font-size: 1.4rem; }
        .star.filled { color: var(--warning); }
        .star.empty { color: var(--gray); }

        .instruction { color: var(--gray-dark); margin-bottom: 20px; font-size: 0.95rem; }

        /* Answer Zone */
        .answer-zone {
            min-height: 70px;
            padding: 15px;
            background: var(--gray-light);
            border-radius: 16px;
            border: 3px dashed var(--gray);
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .answer-zone.correct {
            border-color: var(--success);
            background: rgba(76, 175, 80, 0.1);
        }

        .answer-zone-placeholder {
            color: var(--gray-dark);
            font-style: italic;
        }

        /* Word Bank */
        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            min-height: 60px;
            margin-bottom: 25px;
        }

        /* Word Tiles */
        .word-tile {
            padding: 12px 20px;
            background: var(--black);
            color: var(--white);
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .word-tile:hover {
            transform: translateY(-3px);
            background: var(--orange-dark);
        }

        .word-tile.in-answer {
            background: var(--orange);
        }

        .word-tile.correct {
            background: var(--success);
        }

        /* Lifelines */
        .lifelines-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .lifeline-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 12px 16px;
            background: var(--gray-light);
            border: 2px solid var(--gray);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .lifeline-btn:hover:not(.used) {
            border-color: var(--orange);
            transform: translateY(-2px);
        }

        .lifeline-btn.used {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .lifeline-icon { font-size: 1.4rem; }
        .lifeline-label { font-size: 0.7rem; color: var(--gray-dark); font-weight: 600; }

        .lifeline-count {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--orange);
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-container { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

        .btn {
            padding: 12px 28px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary { background: var(--orange); color: var(--white); }
        .btn-primary:hover { background: var(--orange-dark); transform: translateY(-2px); }
        .btn-secondary { background: var(--gray-light); color: var(--black); }
        .btn-secondary:hover { background: var(--gray); }

        /* Overlays */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .overlay.show { opacity: 1; pointer-events: all; }

        .modal {
            background: var(--white);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            max-width: 400px;
            width: 100%;
        }

        .overlay.show .modal { transform: scale(1); }

        .modal-icon { font-size: 3.5rem; margin-bottom: 15px; }
        .modal-title { font-size: 1.6rem; color: var(--black); margin-bottom: 10px; font-weight: 700; }
        .modal-sentence { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; color: var(--orange); margin-bottom: 10px; font-weight: 600; padding: 0 10px; }
        .modal-stars { font-size: 1.8rem; margin-bottom: 15px; }
        .modal-score { font-size: 1.1rem; color: var(--gray-dark); margin-bottom: 20px; }

        .modal-stats { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
        .modal-stat { text-align: center; }
        .modal-stat-value { font-size: 1.5rem; font-weight: 700; color: var(--orange); }
        .modal-stat-label { font-size: 0.8rem; color: var(--gray-dark); }

        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--white);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 50;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.4s ease; }

        @keyframes pop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .pop { animation: pop 0.3s ease; }

        @media (max-width: 500px) {
            .game-title { font-size: 1.6rem; }
            .game-container { padding: 20px; }
            .word-tile { padding: 10px 14px; font-size: 0.9rem; }
            .stat-box { padding: 8px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <button class="sound-toggle" id="soundToggle">🔊</button>

    <header class="header">
        <div class="logo">Speak Academy</div>
        <h1 class="game-title">Unjumble</h1>
        <p class="set-title" id="setTitle">Loading...</p>
    </header>

    <div class="stats-bar">
        <div class="stat-box">
            <div class="lives-container" id="livesContainer">
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
            </div>
        </div>
        <div class="stat-box">
            <span>⭐</span>
            <span>Score:</span>
            <span class="value" id="score">0</span>
        </div>
        <div class="stat-box">
            <span>🔥</span>
            <span>Streak:</span>
            <span class="value" id="streak">0</span>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="progress-text" id="progressText">Sentence 1 of 10</p>
    </div>

    <main class="game-container">
        <div class="stars-display" id="starsDisplay">
            <span class="star filled">⭐</span>
            <span class="star filled">⭐</span>
            <span class="star filled">⭐</span>
        </div>

        <p class="instruction">Tap words in the correct order to form a sentence</p>

        <div class="answer-zone" id="answerZone">
            <span class="answer-zone-placeholder">Tap words to build the sentence...</span>
        </div>

        <div class="word-bank" id="wordBank"></div>

        <div class="lifelines-container">
            <button class="lifeline-btn" id="hintBtn">
                <span class="lifeline-count" id="hintCount">3</span>
                <span class="lifeline-icon">💡</span>
                <span class="lifeline-label">Hint</span>
            </button>
            <button class="lifeline-btn" id="skipBtn">
                <span class="lifeline-count" id="skipCount">3</span>
                <span class="lifeline-icon">⏭️</span>
                <span class="lifeline-label">Skip</span>
            </button>
        </div>

        <div class="btn-container">
            <button class="btn btn-secondary" id="resetBtn">↺ Reset</button>
            <button class="btn btn-primary" id="checkBtn">Check ✓</button>
        </div>
    </main>

    <!-- Success Modal -->
    <div class="overlay" id="successOverlay">
        <div class="modal">
            <div class="modal-icon">🎉</div>
            <h2 class="modal-title">Correct!</h2>
            <p class="modal-sentence" id="successSentence"></p>
            <div class="modal-stars" id="successStars">⭐⭐⭐</div>
            <p class="modal-score" id="successScore">+100 points</p>
            <button class="btn btn-primary" id="nextBtn">Next Sentence →</button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="overlay" id="gameOverOverlay">
        <div class="modal">
            <div class="modal-icon">💔</div>
            <h2 class="modal-title">Game Over!</h2>
            <p class="modal-sentence" id="gameOverSentence"></p>
            <div class="modal-stats">
                <div class="modal-stat">
                    <div class="modal-stat-value" id="gameOverScore">0</div>
                    <div class="modal-stat-label">Score</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-value" id="gameOverSentences">0</div>
                    <div class="modal-stat-label">Sentences</div>
                </div>
            </div>
            <button class="btn btn-primary" id="retryBtn">Try Again</button>
        </div>
    </div>

    <!-- Complete Modal -->
    <div class="overlay" id="completeOverlay">
        <div class="modal">
            <div class="modal-icon">🏆</div>
            <h2 class="modal-title">Complete!</h2>
            <div class="modal-stats">
                <div class="modal-stat">
                    <div class="modal-stat-value" id="finalScore">0</div>
                    <div class="modal-stat-label">Score</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-value" id="finalStars">0</div>
                    <div class="modal-stat-label">Stars</div>
                </div>
            </div>
            <button class="btn btn-primary" id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <script>
        // ============ CONFIG ============
        const DEFAULT_SENTENCES_URL = 'words/unjumble-sentences.json';
        const urlParams = new URLSearchParams(window.location.search);
        const sentencesParam = urlParams.get('sentences') || urlParams.get('set');

        // ============ STATE ============
        let state = {
            sentences: [],
            setTitle: '',
            currentIndex: 0,
            currentSentence: '',
            currentWords: [],
            shuffledWords: [],
            answerWords: [],
            usedIndices: [],
            hintsUsed: 0,
            score: 0,
            streak: 0,
            lives: 3,
            sentencesCompleted: 0,
            totalStars: 0,
            lifelines: { hint: 3, skip: 3 },
            soundOn: true
        };

        // ============ AUDIO ============
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!state.soundOn) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            switch(type) {
                case 'tap':
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                    break;
                case 'correct':
                    [523, 659, 784].forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.1);
                        g.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.2);
                        o.start(audioCtx.currentTime + i * 0.1);
                        o.stop(audioCtx.currentTime + i * 0.1 + 0.2);
                    });
                    break;
                case 'wrong':
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                    break;
                case 'powerup':
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                    break;
                case 'complete':
                    [523, 659, 784, 1047].forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.15);
                        g.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.15);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.15 + 0.3);
                        o.start(audioCtx.currentTime + i * 0.15);
                        o.stop(audioCtx.currentTime + i * 0.15 + 0.3);
                    });
                    break;
            }
        }

        // ============ HELPERS ============
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ============ LOAD SENTENCES ============
        async function loadSentences() {
            let url = DEFAULT_SENTENCES_URL;
            if (sentencesParam) {
                url = sentencesParam.startsWith('http') ? sentencesParam : `words/${sentencesParam}.json`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                state.sentences = shuffle(data.sentences || data);
                state.setTitle = data.title || 'Sentence Practice';
            } catch (e) {
                state.sentences = shuffle([
                    "I am learning English.",
                    "She goes to school every day.",
                    "They are playing in the park.",
                    "He has finished his homework.",
                    "We will travel to Spain next summer.",
                    "The cat is sleeping on the sofa.",
                    "Do you like chocolate ice cream?",
                    "My brother works at a hospital.",
                    "It was raining when I left home.",
                    "Can you help me with this question?"
                ]);
                state.setTitle = 'Basic Sentences';
            }

            document.getElementById('setTitle').textContent = state.setTitle;
        }

        // ============ GAME LOGIC ============
        function initGame() {
            state.currentIndex = 0;
            state.score = 0;
            state.streak = 0;
            state.lives = 3;
            state.sentencesCompleted = 0;
            state.totalStars = 0;
            state.lifelines = { hint: 3, skip: 3 };
            state.sentences = shuffle(state.sentences);

            updateUI();
            loadSentence();
            hideAllOverlays();
        }

        function loadSentence() {
            state.currentSentence = state.sentences[state.currentIndex];
            state.currentWords = state.currentSentence.split(' ');
            
            // Create shuffled indices
            const indices = state.currentWords.map((_, i) => i);
            state.shuffledWords = shuffle(indices).map(i => ({ word: state.currentWords[i], originalIndex: i }));
            
            state.answerWords = [];
            state.usedIndices = [];
            state.hintsUsed = 0;

            render();
            updateProgress();
            updateStars();
        }

        function render() {
            // Render answer zone
            const answerZone = document.getElementById('answerZone');
            answerZone.innerHTML = '';

            if (state.answerWords.length === 0) {
                answerZone.innerHTML = '<span class="answer-zone-placeholder">Tap words to build the sentence...</span>';
            } else {
                state.answerWords.forEach((item, index) => {
                    const tile = document.createElement('div');
                    tile.className = 'word-tile in-answer';
                    tile.textContent = item.word;
                    tile.addEventListener('click', () => removeFromAnswer(index));
                    answerZone.appendChild(tile);
                });
            }

            // Render word bank
            const wordBank = document.getElementById('wordBank');
            wordBank.innerHTML = '';

            state.shuffledWords.forEach((item, index) => {
                if (!state.usedIndices.includes(index)) {
                    const tile = document.createElement('div');
                    tile.className = 'word-tile';
                    tile.textContent = item.word;
                    tile.addEventListener('click', () => addToAnswer(index));
                    wordBank.appendChild(tile);
                }
            });
        }

        function addToAnswer(shuffledIndex) {
            playSound('tap');
            state.answerWords.push(state.shuffledWords[shuffledIndex]);
            state.usedIndices.push(shuffledIndex);
            render();
        }

        function removeFromAnswer(answerIndex) {
            playSound('tap');
            const item = state.answerWords[answerIndex];
            
            // Find the shuffled index
            const shuffledIndex = state.shuffledWords.findIndex(
                (si, idx) => si.originalIndex === item.originalIndex && state.usedIndices.includes(idx)
            );
            
            // Find actual used index
            const usedIdx = state.usedIndices.find(idx => state.shuffledWords[idx].originalIndex === item.originalIndex);
            
            state.answerWords.splice(answerIndex, 1);
            state.usedIndices = state.usedIndices.filter(idx => idx !== usedIdx);
            
            render();
        }

        function checkAnswer() {
            if (state.answerWords.length !== state.currentWords.length) {
                // Not all words placed
                document.getElementById('answerZone').classList.add('shake');
                setTimeout(() => document.getElementById('answerZone').classList.remove('shake'), 400);
                playSound('wrong');
                return;
            }

            const attempt = state.answerWords.map(item => item.word).join(' ');

            if (attempt === state.currentSentence) {
                handleCorrect();
            } else {
                handleWrong();
            }
        }

        function handleCorrect() {
            playSound('correct');

            let stars = 3;
            if (state.hintsUsed === 1) stars = 2;
            if (state.hintsUsed >= 2) stars = 1;
            state.totalStars += stars;

            const points = stars * 50;
            state.score += points;
            state.streak++;
            state.sentencesCompleted++;

            // Animate answer zone
            document.getElementById('answerZone').classList.add('correct');
            document.querySelectorAll('.answer-zone .word-tile').forEach((tile, i) => {
                setTimeout(() => {
                    tile.classList.add('correct');
                    tile.classList.add('pop');
                }, i * 80);
            });

            setTimeout(() => {
                document.getElementById('successSentence').textContent = state.currentSentence;
                document.getElementById('successStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
                document.getElementById('successScore').textContent = `+${points} points`;
                document.getElementById('successOverlay').classList.add('show');
            }, 500);

            updateUI();
        }

        function handleWrong() {
            playSound('wrong');
            state.lives--;
            state.streak = 0;
            updateUI();

            document.getElementById('answerZone').classList.add('shake');
            setTimeout(() => document.getElementById('answerZone').classList.remove('shake'), 400);

            if (state.lives <= 0) {
                setTimeout(gameOver, 500);
            }
        }

        function nextSentence() {
            hideAllOverlays();
            document.getElementById('answerZone').classList.remove('correct');
            state.currentIndex++;

            if (state.currentIndex >= state.sentences.length) {
                gameComplete();
            } else {
                loadSentence();
            }
        }

        function resetSentence() {
            state.answerWords = [];
            state.usedIndices = [];
            render();
        }

        function gameOver() {
            playSound('wrong');
            document.getElementById('gameOverSentence').textContent = `Correct: ${state.currentSentence}`;
            document.getElementById('gameOverScore').textContent = state.score;
            document.getElementById('gameOverSentences').textContent = state.sentencesCompleted;
            document.getElementById('gameOverOverlay').classList.add('show');
        }

        function gameComplete() {
            playSound('complete');
            document.getElementById('finalScore').textContent = state.score;
            document.getElementById('finalStars').textContent = state.totalStars;
            document.getElementById('completeOverlay').classList.add('show');
        }

        // ============ LIFELINES ============
        function useHint() {
            if (state.lifelines.hint <= 0) return;

            // Find next correct word position
            const nextIndex = state.answerWords.length;
            if (nextIndex >= state.currentWords.length) return;

            state.lifelines.hint--;
            state.hintsUsed++;

            // Find the word that should be at this position
            const correctWord = state.currentWords[nextIndex];
            
            // Find it in shuffled words that hasn't been used yet
            const shuffledIdx = state.shuffledWords.findIndex(
                (item, idx) => item.word === correctWord && !state.usedIndices.includes(idx)
            );
            
            if (shuffledIdx !== -1) {
                state.answerWords.push(state.shuffledWords[shuffledIdx]);
                state.usedIndices.push(shuffledIdx);
            }

            playSound('powerup');
            render();
            updateLifelines();
            updateStars();
        }

        function useSkip() {
            if (state.lifelines.skip <= 0) return;

            state.lifelines.skip--;
            playSound('powerup');
            updateLifelines();
            nextSentence();
        }

        // ============ UI UPDATES ============
        function updateUI() {
            document.getElementById('score').textContent = state.score;
            document.getElementById('streak').textContent = state.streak;
            updateLives();
            updateLifelines();
        }

        function updateLives() {
            const hearts = document.querySelectorAll('.heart');
            hearts.forEach((h, i) => h.classList.toggle('lost', i >= state.lives));
        }

        function updateLifelines() {
            document.getElementById('hintCount').textContent = state.lifelines.hint;
            document.getElementById('skipCount').textContent = state.lifelines.skip;

            document.getElementById('hintBtn').classList.toggle('used', state.lifelines.hint <= 0);
            document.getElementById('skipBtn').classList.toggle('used', state.lifelines.skip <= 0);
        }

        function updateProgress() {
            const pct = (state.currentIndex / state.sentences.length) * 100;
            document.getElementById('progressFill').style.width = `${pct}%`;
            document.getElementById('progressText').textContent =
                `Sentence ${state.currentIndex + 1} of ${state.sentences.length}`;
        }

        function updateStars() {
            const potential = Math.max(1, 3 - state.hintsUsed);
            const display = document.getElementById('starsDisplay');
            display.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const star = document.createElement('span');
                star.className = `star ${i < potential ? 'filled' : 'empty'}`;
                star.textContent = i < potential ? '⭐' : '☆';
                display.appendChild(star);
            }
        }

        function hideAllOverlays() {
            document.querySelectorAll('.overlay').forEach(o => o.classList.remove('show'));
        }

        // ============ EVENT LISTENERS ============
        document.getElementById('hintBtn').addEventListener('click', useHint);
        document.getElementById('skipBtn').addEventListener('click', useSkip);
        document.getElementById('resetBtn').addEventListener('click', resetSentence);
        document.getElementById('checkBtn').addEventListener('click', checkAnswer);
        document.getElementById('nextBtn').addEventListener('click', nextSentence);
        document.getElementById('retryBtn').addEventListener('click', initGame);
        document.getElementById('playAgainBtn').addEventListener('click', initGame);
        document.getElementById('soundToggle').addEventListener('click', () => {
            state.soundOn = !state.soundOn;
            document.getElementById('soundToggle').textContent = state.soundOn ? '🔊' : '🔇';
        });

        // ============ INIT ============
        loadSentences().then(initGame);
    </script>
</body>
</html>
