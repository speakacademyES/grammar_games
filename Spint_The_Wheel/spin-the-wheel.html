<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin the Wheel | Speak Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --black: #1a1a1a;
            --black-light: #2a2a2a;
            --orange: #ff6b35;
            --orange-dark: #e55a2b;
            --orange-light: #ff8c5a;
            --white: #ffffff;
            --gray-light: #f5f5f5;
            --gray: #e0e0e0;
            --gray-dark: #888;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--black) 0%, var(--black-light) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: var(--white);
        }

        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 0.9rem; font-weight: 700; color: var(--orange); letter-spacing: 3px; text-transform: uppercase; }
        .game-title { font-size: 2rem; font-weight: 800; color: var(--white); }
        .set-title { font-size: 0.9rem; color: var(--gray-dark); margin-top: 5px; }

        .game-container {
            background: var(--white);
            border-radius: 24px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            border: 4px solid var(--orange);
        }

        .wheel-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto 25px;
        }

        .wheel-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            box-shadow: 0 0 20px rgba(0,0,0,0.3), inset 0 0 10px rgba(0,0,0,0.1);
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: var(--white);
            border-radius: 50%;
            border: 4px solid var(--black);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 35px solid var(--orange);
            z-index: 20;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .wheel-pointer::after {
            content: '';
            position: absolute;
            top: -35px;
            left: -10px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 15px solid var(--orange-dark);
        }

        .btn {
            padding: 14px 40px;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: var(--orange);
            color: var(--white);
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.4);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--orange-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.5);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-container {
            margin-top: 25px;
            padding: 20px;
            background: var(--gray-light);
            border-radius: 16px;
            display: none;
        }

        .result-container.show { display: block; }

        .result-label {
            font-size: 0.85rem;
            color: var(--gray-dark);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--orange);
        }

        .history-container {
            margin-top: 20px;
            text-align: left;
        }

        .history-title {
            font-size: 0.85rem;
            color: var(--gray-dark);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .history-item {
            background: var(--white);
            border: 2px solid var(--gray);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--black);
        }

        .history-item:first-child {
            border-color: var(--orange);
            background: rgba(255, 107, 53, 0.1);
        }

        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--white);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 50;
        }

        .settings-btn {
            position: fixed;
            top: 20px;
            right: 75px;
            background: var(--white);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 50;
        }

        /* Settings Modal */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .overlay.show { opacity: 1; pointer-events: all; }

        .modal {
            background: var(--white);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .overlay.show .modal { transform: scale(1); }

        .modal-title {
            font-size: 1.4rem;
            color: var(--black);
            margin-bottom: 20px;
            font-weight: 700;
        }

        .modal-input {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid var(--gray);
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            resize: vertical;
            margin-bottom: 15px;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--orange);
        }

        .modal-hint {
            font-size: 0.8rem;
            color: var(--gray-dark);
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-secondary {
            background: var(--gray-light);
            color: var(--black);
        }

        .btn-secondary:hover {
            background: var(--gray);
        }

        @media (max-width: 400px) {
            .wheel-wrapper { width: 280px; height: 280px; }
            .game-title { font-size: 1.6rem; }
            .game-container { padding: 20px; }
        }
    </style>
</head>
<body>
    <button class="settings-btn" id="settingsBtn">⚙️</button>
    <button class="sound-toggle" id="soundToggle">🔊</button>

    <header class="header">
        <div class="logo">Speak Academy</div>
        <h1 class="game-title">Spin the Wheel</h1>
        <p class="set-title" id="setTitle">Loading...</p>
    </header>

    <main class="game-container">
        <div class="wheel-wrapper">
            <div class="wheel-pointer"></div>
            <div class="wheel-container">
                <canvas id="wheelCanvas" width="320" height="320"></canvas>
                <div class="wheel-center">🎯</div>
            </div>
        </div>

        <button class="btn btn-primary" id="spinBtn">Spin!</button>

        <div class="result-container" id="resultContainer">
            <div class="result-label">Result</div>
            <div class="result-text" id="resultText"></div>
        </div>

        <div class="history-container" id="historyContainer" style="display: none;">
            <div class="history-title">History</div>
            <div class="history-list" id="historyList"></div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div class="overlay" id="settingsOverlay">
        <div class="modal">
            <h2 class="modal-title">Edit Wheel Items</h2>
            <textarea class="modal-input" id="itemsInput" placeholder="Enter items, one per line..."></textarea>
            <p class="modal-hint">Enter each item on a new line. Changes will reset the wheel.</p>
            <div class="modal-buttons">
                <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
                <button class="btn btn-primary" id="saveBtn">Save</button>
            </div>
        </div>
    </div>

    <script>
        // ============ CONFIG ============
        const DEFAULT_ITEMS_URL = 'words/wheel-items.json';
        const urlParams = new URLSearchParams(window.location.search);
        const itemsParam = urlParams.get('items') || urlParams.get('set');

        // Wheel colors (alternating)
        const COLORS = [
            '#ff6b35', '#1a1a1a', '#ff8c5a', '#2a2a2a', 
            '#ffab91', '#3a3a3a', '#ff7043', '#4a4a4a'
        ];

        // ============ STATE ============
        let state = {
            items: [],
            setTitle: '',
            isSpinning: false,
            currentRotation: 0,
            history: [],
            soundOn: true
        };

        // ============ AUDIO ============
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!state.soundOn) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            switch(type) {
                case 'tick':
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
                    break;
                case 'win':
                    [523, 659, 784, 1047].forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.12);
                        g.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.12);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.12 + 0.3);
                        o.start(audioCtx.currentTime + i * 0.12);
                        o.stop(audioCtx.currentTime + i * 0.12 + 0.3);
                    });
                    break;
            }
        }

        // ============ CANVAS DRAWING ============
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = canvas.width / 2 - 5;

        function drawWheel() {
            const numItems = state.items.length;
            if (numItems === 0) return;

            const arc = (2 * Math.PI) / numItems;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            state.items.forEach((item, i) => {
                const angle = i * arc;

                // Draw segment
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arc);
                ctx.closePath();
                ctx.fillStyle = COLORS[i % COLORS.length];
                ctx.fill();

                // Draw border
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#ffffff';
                
                // Adjust font size based on text length and number of items
                let fontSize = 14;
                if (numItems > 12) fontSize = 11;
                if (numItems > 16) fontSize = 9;
                if (item.length > 12) fontSize = Math.min(fontSize, 11);
                if (item.length > 16) fontSize = Math.min(fontSize, 9);
                
                ctx.font = `bold ${fontSize}px Outfit`;
                
                // Truncate text if too long
                let displayText = item;
                if (item.length > 15) {
                    displayText = item.substring(0, 13) + '...';
                }
                
                ctx.fillText(displayText, radius - 15, 5);
                ctx.restore();
            });

            // Draw outer ring
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#ff6b35';
            ctx.lineWidth = 5;
            ctx.stroke();
        }

        function rotateWheel(degrees) {
            canvas.style.transform = `rotate(${degrees}deg)`;
        }

        // ============ SPIN LOGIC ============
        function spin() {
            if (state.isSpinning || state.items.length === 0) return;

            state.isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('resultContainer').classList.remove('show');

            // Calculate spin
            const numItems = state.items.length;
            const segmentAngle = 360 / numItems;
            
            // Random number of full rotations (5-8) plus random final position
            const fullRotations = (5 + Math.floor(Math.random() * 4)) * 360;
            const randomSegment = Math.floor(Math.random() * numItems);
            const randomOffset = Math.random() * segmentAngle * 0.8 + segmentAngle * 0.1;
            
            // Calculate final rotation (pointer is at top, so we need to adjust)
            const finalRotation = fullRotations + (randomSegment * segmentAngle) + randomOffset;
            state.currentRotation += finalRotation;

            // Play tick sounds during spin
            let tickCount = 0;
            const tickInterval = setInterval(() => {
                playSound('tick');
                tickCount++;
                if (tickCount > 30) clearInterval(tickInterval);
            }, 100);

            // Apply rotation
            canvas.style.transition = 'transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99)';
            rotateWheel(state.currentRotation);

            // Calculate result after spin
            setTimeout(() => {
                clearInterval(tickInterval);
                
                // Determine winning segment
                // Wheel segments are drawn starting from 0° (right side, 3 o'clock)
                // Pointer is at top (270° or -90°)
                // When wheel rotates clockwise by X degrees, segment at position (270 - X) is at pointer
                const numItems = state.items.length;
                const segmentAngle = 360 / numItems;
                const normalizedRotation = state.currentRotation % 360;
                
                // Pointer is at 270° (top), wheel rotates clockwise
                // So we need: (270 - rotation) to find what's at the pointer
                let pointerPosition = (270 - normalizedRotation) % 360;
                if (pointerPosition < 0) pointerPosition += 360;
                
                const winningIndex = Math.floor(pointerPosition / segmentAngle) % numItems;
                const winner = state.items[winningIndex];

                // Show result
                playSound('win');
                document.getElementById('resultText').textContent = winner;
                document.getElementById('resultContainer').classList.add('show');

                // Add to history
                state.history.unshift(winner);
                if (state.history.length > 10) state.history.pop();
                updateHistory();

                state.isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
            }, 4100);
        }

        // ============ HISTORY ============
        function updateHistory() {
            const container = document.getElementById('historyContainer');
            const list = document.getElementById('historyList');

            if (state.history.length === 0) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'block';
            list.innerHTML = state.history.map(item => 
                `<span class="history-item">${item}</span>`
            ).join('');
        }

        // ============ LOAD ITEMS ============
        async function loadItems() {
            let url = DEFAULT_ITEMS_URL;
            if (itemsParam) {
                url = itemsParam.startsWith('http') ? itemsParam : `words/${itemsParam}.json`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                state.items = data.items || data.words || data;
                state.setTitle = data.title || 'Custom Wheel';
            } catch (e) {
                // Fallback items
                state.items = [
                    'Present Simple', 'Past Simple', 'Future Simple',
                    'Present Continuous', 'Past Continuous', 
                    'Present Perfect', 'Past Perfect',
                    'Conditionals', 'Passive Voice', 'Modal Verbs'
                ];
                state.setTitle = 'Grammar Topics';
            }

            document.getElementById('setTitle').textContent = state.setTitle;
            document.getElementById('itemsInput').value = state.items.join('\n');
            drawWheel();
        }

        // ============ SETTINGS ============
        function openSettings() {
            document.getElementById('itemsInput').value = state.items.join('\n');
            document.getElementById('settingsOverlay').classList.add('show');
        }

        function closeSettings() {
            document.getElementById('settingsOverlay').classList.remove('show');
        }

        function saveSettings() {
            const input = document.getElementById('itemsInput').value;
            const newItems = input.split('\n')
                .map(item => item.trim())
                .filter(item => item.length > 0);

            if (newItems.length < 2) {
                alert('Please enter at least 2 items');
                return;
            }

            state.items = newItems;
            state.history = [];
            state.currentRotation = 0;
            canvas.style.transition = 'none';
            rotateWheel(0);
            
            updateHistory();
            drawWheel();
            closeSettings();
            
            document.getElementById('resultContainer').classList.remove('show');
        }

        // ============ EVENT LISTENERS ============
        document.getElementById('spinBtn').addEventListener('click', spin);
        document.getElementById('settingsBtn').addEventListener('click', openSettings);
        document.getElementById('cancelBtn').addEventListener('click', closeSettings);
        document.getElementById('saveBtn').addEventListener('click', saveSettings);
        document.getElementById('soundToggle').addEventListener('click', () => {
            state.soundOn = !state.soundOn;
            document.getElementById('soundToggle').textContent = state.soundOn ? '🔊' : '🔇';
        });

        // Close modal on overlay click
        document.getElementById('settingsOverlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('settingsOverlay')) {
                closeSettings();
            }
        });

        // ============ INIT ============
        loadItems();
    </script>
</body>
</html>
