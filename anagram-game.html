<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anagram Game | Speak Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --black: #1a1a1a;
            --black-light: #2a2a2a;
            --orange: #ff6b35;
            --orange-dark: #e55a2b;
            --orange-light: #ff8c5a;
            --white: #ffffff;
            --gray-light: #f5f5f5;
            --gray: #e0e0e0;
            --gray-dark: #888;
            --success: #4caf50;
            --info: #3b82f6;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--black) 0%, var(--black-light) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: var(--white);
        }

        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 0.9rem; font-weight: 700; color: var(--orange); letter-spacing: 3px; text-transform: uppercase; }
        .game-title { font-size: 2rem; font-weight: 800; color: var(--white); }
        .set-title { font-size: 0.9rem; color: var(--gray-dark); margin-top: 5px; }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 600px;
        }

        .stat-box {
            background: var(--black-light);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .stat-box .value {
            font-family: 'JetBrains Mono', monospace;
            color: var(--orange);
            font-weight: 700;
        }

        .lives-container { display: flex; gap: 4px; }
        .heart { font-size: 1.2rem; transition: all 0.3s ease; }
        .heart.lost { opacity: 0.2; transform: scale(0.8); }

        .progress-container { width: 100%; max-width: 600px; margin-bottom: 20px; }
        .progress-bar { height: 10px; background: var(--black-light); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--orange), var(--orange-light)); border-radius: 10px; transition: width 0.5s ease; }
        .progress-text { text-align: center; margin-top: 6px; font-size: 0.85rem; color: var(--gray-dark); }

        .game-container {
            background: var(--white);
            border-radius: 24px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            border: 4px solid var(--orange);
        }

        .stars-display { display: flex; justify-content: center; gap: 5px; margin-bottom: 15px; }
        .star { font-size: 1.4rem; }
        .star.filled { color: var(--warning); }
        .star.empty { color: var(--gray); }

        .instruction { color: var(--gray-dark); margin-bottom: 20px; font-size: 0.95rem; }

        .drop-zone {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            min-height: 70px;
            padding: 15px;
            background: var(--gray-light);
            border-radius: 16px;
            border: 3px dashed var(--gray);
        }

        .letter-slot {
            width: 46px; height: 56px;
            background: var(--white);
            border: 3px solid var(--gray);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--black);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .letter-slot.filled { border-color: var(--orange); background: var(--orange); color: var(--white); }
        .letter-slot.revealed { border-color: var(--info); background: var(--info); color: var(--white); }
        .letter-slot.correct { border-color: var(--success); background: var(--success); color: var(--white); }
        .letter-slot.space { background: transparent; border: none; width: 20px; cursor: default; }

        .letter-bank { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; min-height: 60px; margin-bottom: 25px; }

        .letter-tile {
            width: 46px; height: 56px;
            background: var(--black);
            color: var(--white);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .letter-tile:hover { transform: translateY(-4px); background: var(--orange-dark); }
        .letter-tile.used { opacity: 0.2; pointer-events: none; transform: scale(0.9); }

        .lifelines-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }

        .lifeline-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 12px 16px;
            background: var(--gray-light);
            border: 2px solid var(--gray);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .lifeline-btn:hover:not(.used) { border-color: var(--orange); transform: translateY(-2px); }
        .lifeline-btn.used { opacity: 0.4; cursor: not-allowed; }
        .lifeline-icon { font-size: 1.4rem; }
        .lifeline-label { font-size: 0.7rem; color: var(--gray-dark); font-weight: 600; }

        .lifeline-count {
            position: absolute;
            top: -6px; right: -6px;
            background: var(--orange);
            color: white;
            width: 20px; height: 20px;
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-container { display: flex; gap: 10px; justify-content: center; }

        .btn {
            padding: 12px 28px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary { background: var(--orange); color: var(--white); }
        .btn-primary:hover { background: var(--orange-dark); transform: translateY(-2px); }
        .btn-secondary { background: var(--gray-light); color: var(--black); }
        .btn-secondary:hover { background: var(--gray); }

        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .overlay.show { opacity: 1; pointer-events: all; }

        .modal {
            background: var(--white);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            max-width: 400px;
            width: 100%;
        }

        .overlay.show .modal { transform: scale(1); }

        .modal-icon { font-size: 3.5rem; margin-bottom: 15px; }
        .modal-title { font-size: 1.6rem; color: var(--black); margin-bottom: 10px; font-weight: 700; }
        .modal-word { font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; color: var(--orange); margin-bottom: 10px; font-weight: 700; }
        .modal-stars { font-size: 1.8rem; margin-bottom: 15px; }
        .modal-score { font-size: 1.1rem; color: var(--gray-dark); margin-bottom: 20px; }

        .modal-stats { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
        .modal-stat { text-align: center; }
        .modal-stat-value { font-size: 1.5rem; font-weight: 700; color: var(--orange); }
        .modal-stat-label { font-size: 0.8rem; color: var(--gray-dark); }

        .sound-toggle {
            position: fixed;
            top: 20px; right: 20px;
            background: var(--white);
            border: none;
            width: 44px; height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 50;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.4s ease; }

        @keyframes pop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .pop { animation: pop 0.3s ease; }

        @media (max-width: 500px) {
            .game-title { font-size: 1.6rem; }
            .game-container { padding: 20px; }
            .letter-slot, .letter-tile { width: 38px; height: 48px; font-size: 1.3rem; }
            .stat-box { padding: 8px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <button class="sound-toggle" id="soundToggle">🔊</button>

    <header class="header">
        <div class="logo">Speak Academy</div>
        <h1 class="game-title">Anagram Challenge</h1>
        <p class="set-title" id="setTitle">Loading...</p>
    </header>

    <div class="stats-bar">
        <div class="stat-box">
            <div class="lives-container" id="livesContainer">
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
            </div>
        </div>
        <div class="stat-box">
            <span>⭐</span>
            <span>Score:</span>
            <span class="value" id="score">0</span>
        </div>
        <div class="stat-box">
            <span>🔥</span>
            <span>Streak:</span>
            <span class="value" id="streak">0</span>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="progress-text" id="progressText">Word 1 of 27</p>
    </div>

    <main class="game-container">
        <div class="stars-display" id="starsDisplay">
            <span class="star filled">⭐</span>
            <span class="star filled">⭐</span>
            <span class="star filled">⭐</span>
        </div>

        <p class="instruction">Tap letters to spell the word</p>

        <div class="drop-zone" id="dropZone"></div>
        <div class="letter-bank" id="letterBank"></div>

        <div class="lifelines-container">
            <button class="lifeline-btn" id="hintBtn">
                <span class="lifeline-count" id="hintCount">3</span>
                <span class="lifeline-icon">💡</span>
                <span class="lifeline-label">Hint</span>
            </button>
            <button class="lifeline-btn" id="vowelsBtn">
                <span class="lifeline-count" id="vowelsCount">3</span>
                <span class="lifeline-icon">🔤</span>
                <span class="lifeline-label">Vowels</span>
            </button>
            <button class="lifeline-btn" id="skipBtn">
                <span class="lifeline-count" id="skipCount">3</span>
                <span class="lifeline-icon">⏭️</span>
                <span class="lifeline-label">Skip</span>
            </button>
        </div>

        <div class="btn-container">
            <button class="btn btn-secondary" id="resetBtn">↺ Reset</button>
        </div>
    </main>

    <!-- Success Modal -->
    <div class="overlay" id="successOverlay">
        <div class="modal">
            <div class="modal-icon">🎉</div>
            <h2 class="modal-title">Correct!</h2>
            <p class="modal-word" id="successWord"></p>
            <div class="modal-stars" id="successStars">⭐⭐⭐</div>
            <p class="modal-score" id="successScore">+100 points</p>
            <button class="btn btn-primary" id="nextWordBtn">Next Word →</button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="overlay" id="gameOverOverlay">
        <div class="modal">
            <div class="modal-icon">💔</div>
            <h2 class="modal-title">Game Over!</h2>
            <p class="modal-word" id="gameOverWord"></p>
            <div class="modal-stats">
                <div class="modal-stat">
                    <div class="modal-stat-value" id="gameOverScore">0</div>
                    <div class="modal-stat-label">Score</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-value" id="gameOverWords">0</div>
                    <div class="modal-stat-label">Words</div>
                </div>
            </div>
            <button class="btn btn-primary" id="retryBtn">Try Again</button>
        </div>
    </div>

    <!-- Complete Modal -->
    <div class="overlay" id="completeOverlay">
        <div class="modal">
            <div class="modal-icon">🏆</div>
            <h2 class="modal-title">Complete!</h2>
            <div class="modal-stats">
                <div class="modal-stat">
                    <div class="modal-stat-value" id="finalScore">0</div>
                    <div class="modal-stat-label">Score</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-value" id="finalStars">0</div>
                    <div class="modal-stat-label">Stars</div>
                </div>
            </div>
            <button class="btn btn-primary" id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <script>
        // ============ CONFIG ============
        const DEFAULT_WORDS_URL = 'words/anagram-weather-disasters.json';
        const urlParams = new URLSearchParams(window.location.search);
        const wordsParam = urlParams.get('words') || urlParams.get('set');

        // ============ STATE ============
        let state = {
            words: [],
            setTitle: '',
            currentIndex: 0,
            currentWord: '',
            scrambled: [],
            placed: [],
            revealed: [],
            score: 0,
            streak: 0,
            lives: 3,
            hintsUsed: 0,
            wordsCompleted: 0,
            totalStars: 0,
            lifelines: { hint: 3, vowels: 3, skip: 3 },
            soundOn: true
        };

        // ============ AUDIO ============
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!state.soundOn) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            switch(type) {
                case 'tap':
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                    break;
                case 'correct':
                    [523, 659, 784].forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.1);
                        g.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.2);
                        o.start(audioCtx.currentTime + i * 0.1);
                        o.stop(audioCtx.currentTime + i * 0.1 + 0.2);
                    });
                    break;
                case 'wrong':
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                    break;
                case 'powerup':
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                    break;
                case 'complete':
                    [523, 659, 784, 1047].forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.15);
                        g.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.15);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.15 + 0.3);
                        o.start(audioCtx.currentTime + i * 0.15);
                        o.stop(audioCtx.currentTime + i * 0.15 + 0.3);
                    });
                    break;
            }
        }

        // ============ HELPERS ============
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ============ LOAD WORDS ============
        async function loadWords() {
            let url = DEFAULT_WORDS_URL;
            if (wordsParam) {
                url = wordsParam.startsWith('http') ? wordsParam : `words/${wordsParam}.json`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                state.words = shuffle(data.words || data);
                state.setTitle = data.title || 'Word Set';
            } catch (e) {
                state.words = shuffle([
                    "tsunami", "heatwave", "volcanic", "eruption", "snowfall",
                    "earthquake", "flood", "lightning", "hurricane", "avalanche",
                    "thunderstorm", "sunny", "warm", "hot", "mild", "calm", "fine",
                    "pleasant", "still", "foggy", "cold", "rainy", "snowy", "windy",
                    "freezing", "icy", "humid"
                ]);
                state.setTitle = 'Weather & Natural Disasters';
            }
            document.getElementById('setTitle').textContent = state.setTitle;
        }

        // ============ GAME LOGIC ============
        function initGame() {
            state.currentIndex = 0;
            state.score = 0;
            state.streak = 0;
            state.lives = 3;
            state.wordsCompleted = 0;
            state.totalStars = 0;
            state.lifelines = { hint: 3, vowels: 3, skip: 3 };
            state.words = shuffle(state.words);

            updateUI();
            loadWord();
            hideAllOverlays();
        }

        function loadWord() {
            state.currentWord = state.words[state.currentIndex].toUpperCase();
            state.placed = new Array(state.currentWord.length).fill(null);
            state.revealed = [];
            state.hintsUsed = 0;

            const letters = state.currentWord.split('').filter(c => c !== ' ');
            state.scrambled = shuffle(letters);

            render();
            updateProgress();
            updateStars();
        }

        function render() {
            const dropZone = document.getElementById('dropZone');
            dropZone.innerHTML = '';
            
            state.currentWord.split('').forEach((char, i) => {
                if (char === ' ') {
                    dropZone.innerHTML += '<div class="letter-slot space"></div>';
                } else {
                    const filled = state.placed[i] !== null;
                    const isRevealed = state.revealed.includes(i);
                    let cls = 'letter-slot';
                    if (isRevealed) cls += ' revealed';
                    else if (filled) cls += ' filled';

                    const slot = document.createElement('div');
                    slot.className = cls;
                    slot.textContent = state.placed[i] || '';
                    slot.addEventListener('click', () => removeFromSlot(i));
                    dropZone.appendChild(slot);
                }
            });

            const bank = document.getElementById('letterBank');
            bank.innerHTML = '';

            const usedCounts = {};
            state.scrambled.forEach((letter) => {
                const tile = document.createElement('div');
                tile.className = 'letter-tile';
                tile.textContent = letter;

                usedCounts[letter] = (usedCounts[letter] || 0) + 1;
                const placedCount = state.placed.filter((l, idx) =>
                    l === letter && !state.revealed.includes(idx)
                ).length;

                if (usedCounts[letter] <= placedCount) {
                    tile.classList.add('used');
                } else {
                    tile.addEventListener('click', () => placeLetter(letter));
                }
                bank.appendChild(tile);
            });
        }

        function placeLetter(letter) {
            const emptyIdx = state.placed.findIndex((l, i) =>
                l === null && state.currentWord[i] !== ' '
            );
            if (emptyIdx === -1) return;

            state.placed[emptyIdx] = letter;
            playSound('tap');
            render();
            checkAnswer();
        }

        function removeFromSlot(index) {
            if (state.revealed.includes(index)) return;
            if (state.placed[index] === null) return;

            state.placed[index] = null;
            render();
        }

        function checkAnswer() {
            const allFilled = state.placed.every((l, i) =>
                l !== null || state.currentWord[i] === ' '
            );
            if (!allFilled) return;

            const attempt = state.placed.map((l, i) =>
                state.currentWord[i] === ' ' ? ' ' : l
            ).join('');

            if (attempt === state.currentWord) {
                handleCorrect();
            } else {
                handleWrong();
            }
        }

        function handleCorrect() {
            playSound('correct');

            let stars = 3;
            if (state.hintsUsed === 1) stars = 2;
            if (state.hintsUsed >= 2) stars = 1;
            state.totalStars += stars;

            const points = stars * 50;
            state.score += points;
            state.streak++;
            state.wordsCompleted++;

            document.querySelectorAll('.letter-slot:not(.space)').forEach((slot, i) => {
                setTimeout(() => slot.classList.add('correct', 'pop'), i * 50);
            });

            setTimeout(() => {
                document.getElementById('successWord').textContent = state.currentWord;
                document.getElementById('successStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
                document.getElementById('successScore').textContent = `+${points} points`;
                document.getElementById('successOverlay').classList.add('show');
            }, 400);

            updateUI();
        }

        function handleWrong() {
            playSound('wrong');
            state.lives--;
            state.streak = 0;
            updateUI();

            document.getElementById('dropZone').classList.add('shake');
            setTimeout(() => document.getElementById('dropZone').classList.remove('shake'), 400);

            if (state.lives <= 0) {
                setTimeout(gameOver, 500);
            }
        }

        function nextWord() {
            hideAllOverlays();
            state.currentIndex++;

            if (state.currentIndex >= state.words.length) {
                gameComplete();
            } else {
                loadWord();
            }
        }

        function gameOver() {
            playSound('wrong');
            document.getElementById('gameOverWord').textContent = `The word was: ${state.currentWord}`;
            document.getElementById('gameOverScore').textContent = state.score;
            document.getElementById('gameOverWords').textContent = state.wordsCompleted;
            document.getElementById('gameOverOverlay').classList.add('show');
        }

        function gameComplete() {
            playSound('complete');
            document.getElementById('finalScore').textContent = state.score;
            document.getElementById('finalStars').textContent = state.totalStars;
            document.getElementById('completeOverlay').classList.add('show');
        }

        // ============ LIFELINES ============
        function useHint() {
            if (state.lifelines.hint <= 0) return;

            const empty = state.placed.map((l, i) => l === null && state.currentWord[i] !== ' ' ? i : -1)
                .filter(i => i >= 0);
            if (empty.length === 0) return;

            state.lifelines.hint--;
            state.hintsUsed++;

            const idx = empty[Math.floor(Math.random() * empty.length)];
            const letter = state.currentWord[idx];
            state.placed[idx] = letter;
            state.revealed.push(idx);
            
            // Remove this letter from scrambled letters (one instance)
            const scrambledIdx = state.scrambled.indexOf(letter);
            if (scrambledIdx !== -1) {
                state.scrambled.splice(scrambledIdx, 1);
            }

            playSound('powerup');
            render();
            updateLifelines();
            updateStars();
            checkAnswer();
        }

        function useVowels() {
            if (state.lifelines.vowels <= 0) return;

            const vowels = ['A', 'E', 'I', 'O', 'U'];
            let used = false;

            state.currentWord.split('').forEach((char, i) => {
                if (vowels.includes(char) && state.placed[i] === null) {
                    state.placed[i] = char;
                    state.revealed.push(i);
                    // Remove this vowel from scrambled letters (one instance)
                    const idx = state.scrambled.indexOf(char);
                    if (idx !== -1) {
                        state.scrambled.splice(idx, 1);
                    }
                    used = true;
                }
            });

            if (used) {
                state.lifelines.vowels--;
                state.hintsUsed++;
                playSound('powerup');
                render();
                updateLifelines();
                updateStars();
                checkAnswer();
            }
        }

        function useSkip() {
            if (state.lifelines.skip <= 0) return;

            state.lifelines.skip--;
            playSound('powerup');
            updateLifelines();
            nextWord();
        }

        function resetWord() {
            state.placed = state.placed.map((l, i) =>
                state.revealed.includes(i) ? l : null
            );
            render();
        }

        // ============ UI UPDATES ============
        function updateUI() {
            document.getElementById('score').textContent = state.score;
            document.getElementById('streak').textContent = state.streak;
            updateLives();
            updateLifelines();
        }

        function updateLives() {
            const hearts = document.querySelectorAll('.heart');
            hearts.forEach((h, i) => h.classList.toggle('lost', i >= state.lives));
        }

        function updateLifelines() {
            document.getElementById('hintCount').textContent = state.lifelines.hint;
            document.getElementById('vowelsCount').textContent = state.lifelines.vowels;
            document.getElementById('skipCount').textContent = state.lifelines.skip;

            document.getElementById('hintBtn').classList.toggle('used', state.lifelines.hint <= 0);
            document.getElementById('vowelsBtn').classList.toggle('used', state.lifelines.vowels <= 0);
            document.getElementById('skipBtn').classList.toggle('used', state.lifelines.skip <= 0);
        }

        function updateProgress() {
            const pct = (state.currentIndex / state.words.length) * 100;
            document.getElementById('progressFill').style.width = `${pct}%`;
            document.getElementById('progressText').textContent =
                `Word ${state.currentIndex + 1} of ${state.words.length}`;
        }

        function updateStars() {
            const potential = Math.max(1, 3 - state.hintsUsed);
            const display = document.getElementById('starsDisplay');
            display.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const star = document.createElement('span');
                star.className = `star ${i < potential ? 'filled' : 'empty'}`;
                star.textContent = i < potential ? '⭐' : '☆';
                display.appendChild(star);
            }
        }

        function hideAllOverlays() {
            document.querySelectorAll('.overlay').forEach(o => o.classList.remove('show'));
        }

        // ============ EVENT LISTENERS ============
        document.getElementById('hintBtn').addEventListener('click', useHint);
        document.getElementById('vowelsBtn').addEventListener('click', useVowels);
        document.getElementById('skipBtn').addEventListener('click', useSkip);
        document.getElementById('resetBtn').addEventListener('click', resetWord);
        document.getElementById('nextWordBtn').addEventListener('click', nextWord);
        document.getElementById('retryBtn').addEventListener('click', initGame);
        document.getElementById('playAgainBtn').addEventListener('click', initGame);
        document.getElementById('soundToggle').addEventListener('click', () => {
            state.soundOn = !state.soundOn;
            document.getElementById('soundToggle').textContent = state.soundOn ? '🔊' : '🔇';
        });

        // ============ INIT ============
        loadWords().then(initGame);
    </script>
</body>
</html>
