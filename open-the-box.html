<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open the Box | Speak Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --black: #1a1a1a;
            --black-light: #2a2a2a;
            --orange: #ff6b35;
            --orange-dark: #e55a2b;
            --orange-light: #ff8c5a;
            --white: #ffffff;
            --gray-light: #f5f5f5;
            --gray: #e0e0e0;
            --gray-dark: #888;
            --success: #4caf50;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--black) 0%, var(--black-light) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: var(--white);
        }

        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 0.9rem; font-weight: 700; color: var(--orange); letter-spacing: 3px; text-transform: uppercase; }
        .game-title { font-size: 2rem; font-weight: 800; color: var(--white); }
        .set-title { font-size: 0.9rem; color: var(--gray-dark); margin-top: 5px; }

        .game-container {
            background: var(--white);
            border-radius: 24px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            border: 4px solid var(--orange);
        }

        .instruction {
            color: var(--gray-dark);
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .boxes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .box {
            aspect-ratio: 1;
            background: linear-gradient(145deg, var(--orange), var(--orange-dark));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.3);
            position: relative;
            overflow: hidden;
        }

        .box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(145deg, rgba(255,255,255,0.2) 0%, transparent 50%);
            border-radius: 16px;
        }

        .box:hover:not(.opened) {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.4);
        }

        .box:active:not(.opened) {
            transform: scale(0.95);
        }

        .box-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2rem;
            font-weight: 700;
            color: var(--white);
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .box.opened {
            background: var(--gray-light);
            cursor: default;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.1);
        }

        .box.opened::before {
            display: none;
        }

        .box.opened .box-number {
            display: none;
        }

        .box-content {
            display: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--black);
            padding: 10px;
            text-align: center;
            word-break: break-word;
        }

        .box.opened .box-content {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .box.opening {
            animation: boxOpen 0.5s ease forwards;
        }

        @keyframes boxOpen {
            0% { transform: scale(1); }
            30% { transform: scale(1.1) rotateY(0deg); }
            60% { transform: scale(1.1) rotateY(90deg); }
            100% { transform: scale(1) rotateY(0deg); }
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: var(--gray-light);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--orange), var(--orange-light));
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .progress-text {
            font-size: 0.85rem;
            color: var(--gray-dark);
            margin-bottom: 20px;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--orange);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--orange-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--gray-light);
            color: var(--black);
        }

        .btn-secondary:hover {
            background: var(--gray);
        }

        /* Current reveal display */
        .current-reveal {
            background: var(--gray-light);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }

        .current-reveal.show {
            display: block;
        }

        .current-reveal-label {
            font-size: 0.8rem;
            color: var(--gray-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .current-reveal-content {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--orange);
        }

        /* Settings Modal */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .overlay.show { opacity: 1; pointer-events: all; }

        .modal {
            background: var(--white);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .overlay.show .modal { transform: scale(1); }

        .modal-title {
            font-size: 1.4rem;
            color: var(--black);
            margin-bottom: 20px;
            font-weight: 700;
        }

        .modal-input {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid var(--gray);
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            resize: vertical;
            margin-bottom: 15px;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--orange);
        }

        .modal-hint {
            font-size: 0.8rem;
            color: var(--gray-dark);
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--white);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 50;
        }

        .settings-btn {
            position: fixed;
            top: 20px;
            right: 75px;
            background: var(--white);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 50;
        }

        /* Complete overlay */
        .complete-modal .modal-icon {
            font-size: 4rem;
            margin-bottom: 15px;
        }

        @media (max-width: 400px) {
            .game-title { font-size: 1.6rem; }
            .game-container { padding: 20px; }
            .boxes-grid { gap: 10px; }
            .box-number { font-size: 1.5rem; }
            .box-content { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <button class="settings-btn" id="settingsBtn">⚙️</button>
    <button class="sound-toggle" id="soundToggle">🔊</button>

    <header class="header">
        <div class="logo">Speak Academy</div>
        <h1 class="game-title">Open the Box</h1>
        <p class="set-title" id="setTitle">Loading...</p>
    </header>

    <main class="game-container">
        <p class="instruction">Tap a box to reveal what's inside</p>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <p class="progress-text" id="progressText">0 of 10 opened</p>

        <div class="current-reveal" id="currentReveal">
            <div class="current-reveal-label">Box <span id="revealNumber">1</span></div>
            <div class="current-reveal-content" id="revealContent"></div>
        </div>

        <div class="boxes-grid" id="boxesGrid"></div>

        <div class="btn-container">
            <button class="btn btn-secondary" id="resetBtn">↺ Reset</button>
            <button class="btn btn-primary" id="randomBtn">🎲 Random</button>
        </div>
    </main>

    <!-- Settings Modal -->
    <div class="overlay" id="settingsOverlay">
        <div class="modal">
            <h2 class="modal-title">Edit Box Contents</h2>
            <textarea class="modal-input" id="itemsInput" placeholder="Enter items, one per line..."></textarea>
            <p class="modal-hint">Enter each item on a new line. Number of boxes will match number of items.</p>
            <div class="modal-buttons">
                <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
                <button class="btn btn-primary" id="saveBtn">Save</button>
            </div>
        </div>
    </div>

    <!-- Complete Modal -->
    <div class="overlay" id="completeOverlay">
        <div class="modal complete-modal">
            <div class="modal-icon">🎉</div>
            <h2 class="modal-title">All Boxes Opened!</h2>
            <p style="color: var(--gray-dark); margin-bottom: 20px;">You've revealed all the items</p>
            <button class="btn btn-primary" id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <script>
        // ============ CONFIG ============
        const DEFAULT_ITEMS_URL = 'words/box-items.json';
        const urlParams = new URLSearchParams(window.location.search);
        const itemsParam = urlParams.get('items') || urlParams.get('set');

        // ============ STATE ============
        let state = {
            items: [],
            setTitle: '',
            openedBoxes: [],
            soundOn: true
        };

        // ============ AUDIO ============
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!state.soundOn) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            switch(type) {
                case 'open':
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                    break;
                case 'complete':
                    [523, 659, 784, 1047].forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.12);
                        g.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.12);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.12 + 0.3);
                        o.start(audioCtx.currentTime + i * 0.12);
                        o.stop(audioCtx.currentTime + i * 0.12 + 0.3);
                    });
                    break;
            }
        }

        // ============ RENDER ============
        function renderBoxes() {
            const grid = document.getElementById('boxesGrid');
            grid.innerHTML = '';

            state.items.forEach((item, index) => {
                const box = document.createElement('div');
                box.className = 'box';
                if (state.openedBoxes.includes(index)) {
                    box.classList.add('opened');
                }
                box.dataset.index = index;

                box.innerHTML = `
                    <span class="box-number">${index + 1}</span>
                    <span class="box-content">${item}</span>
                `;

                box.addEventListener('click', () => openBox(index));
                grid.appendChild(box);
            });

            updateProgress();
        }

        function updateProgress() {
            const total = state.items.length;
            const opened = state.openedBoxes.length;
            const pct = total > 0 ? (opened / total) * 100 : 0;

            document.getElementById('progressFill').style.width = `${pct}%`;
            document.getElementById('progressText').textContent = `${opened} of ${total} opened`;
        }

        // ============ GAME LOGIC ============
        function openBox(index) {
            if (state.openedBoxes.includes(index)) return;

            playSound('open');
            state.openedBoxes.push(index);

            const box = document.querySelector(`.box[data-index="${index}"]`);
            box.classList.add('opening');

            setTimeout(() => {
                box.classList.remove('opening');
                box.classList.add('opened');
            }, 500);

            // Show current reveal
            document.getElementById('revealNumber').textContent = index + 1;
            document.getElementById('revealContent').textContent = state.items[index];
            document.getElementById('currentReveal').classList.add('show');

            updateProgress();

            // Check if all opened
            if (state.openedBoxes.length === state.items.length) {
                setTimeout(() => {
                    playSound('complete');
                    document.getElementById('completeOverlay').classList.add('show');
                }, 600);
            }
        }

        function openRandomBox() {
            const unopened = state.items
                .map((_, i) => i)
                .filter(i => !state.openedBoxes.includes(i));

            if (unopened.length === 0) return;

            const randomIndex = unopened[Math.floor(Math.random() * unopened.length)];
            openBox(randomIndex);
        }

        function resetGame() {
            state.openedBoxes = [];
            document.getElementById('currentReveal').classList.remove('show');
            document.getElementById('completeOverlay').classList.remove('show');
            renderBoxes();
        }

        // ============ LOAD ITEMS ============
        async function loadItems() {
            let url = DEFAULT_ITEMS_URL;
            if (itemsParam) {
                url = itemsParam.startsWith('http') ? itemsParam : `words/${itemsParam}.json`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                state.items = data.items || data.words || data;
                state.setTitle = data.title || 'Mystery Boxes';
            } catch (e) {
                // Fallback items
                state.items = [
                    'Apple 🍎',
                    'Banana 🍌',
                    'Cherry 🍒',
                    'Dog 🐕',
                    'Elephant 🐘',
                    'Fish 🐟',
                    'Guitar 🎸',
                    'House 🏠',
                    'Ice cream 🍦',
                    'Jacket 🧥'
                ];
                state.setTitle = 'Mystery Boxes';
            }

            document.getElementById('setTitle').textContent = state.setTitle;
            document.getElementById('itemsInput').value = state.items.join('\n');
            renderBoxes();
        }

        // ============ SETTINGS ============
        function openSettings() {
            document.getElementById('itemsInput').value = state.items.join('\n');
            document.getElementById('settingsOverlay').classList.add('show');
        }

        function closeSettings() {
            document.getElementById('settingsOverlay').classList.remove('show');
        }

        function saveSettings() {
            const input = document.getElementById('itemsInput').value;
            const newItems = input.split('\n')
                .map(item => item.trim())
                .filter(item => item.length > 0);

            if (newItems.length < 1) {
                alert('Please enter at least 1 item');
                return;
            }

            state.items = newItems;
            state.openedBoxes = [];
            document.getElementById('currentReveal').classList.remove('show');
            
            renderBoxes();
            closeSettings();
        }

        // ============ EVENT LISTENERS ============
        document.getElementById('resetBtn').addEventListener('click', resetGame);
        document.getElementById('randomBtn').addEventListener('click', openRandomBox);
        document.getElementById('settingsBtn').addEventListener('click', openSettings);
        document.getElementById('cancelBtn').addEventListener('click', closeSettings);
        document.getElementById('saveBtn').addEventListener('click', saveSettings);
        document.getElementById('playAgainBtn').addEventListener('click', resetGame);
        document.getElementById('soundToggle').addEventListener('click', () => {
            state.soundOn = !state.soundOn;
            document.getElementById('soundToggle').textContent = state.soundOn ? '🔊' : '🔇';
        });

        document.getElementById('settingsOverlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('settingsOverlay')) {
                closeSettings();
            }
        });

        // ============ INIT ============
        loadItems();
    </script>
</body>
</html>
