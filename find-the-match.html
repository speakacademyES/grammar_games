<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the Match | Speak Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --black: #1a1a1a;
            --black-light: #2a2a2a;
            --orange: #ff6b35;
            --orange-dark: #e55a2b;
            --orange-light: #ff8c5a;
            --white: #ffffff;
            --gray-light: #f5f5f5;
            --gray: #e0e0e0;
            --gray-dark: #888;
            --success: #4caf50;
            --danger: #ef4444;
            --info: #3b82f6;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--black) 0%, var(--black-light) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: var(--white);
        }

        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 0.9rem; font-weight: 700; color: var(--orange); letter-spacing: 3px; text-transform: uppercase; }
        .game-title { font-size: 2rem; font-weight: 800; color: var(--white); }
        .set-title { font-size: 0.9rem; color: var(--gray-dark); margin-top: 5px; }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 600px;
        }

        .stat-box {
            background: var(--black-light);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .stat-box .value {
            font-family: 'JetBrains Mono', monospace;
            color: var(--orange);
            font-weight: 700;
        }

        .lives-container { display: flex; gap: 4px; }
        .heart { font-size: 1.2rem; transition: all 0.3s ease; }
        .heart.lost { opacity: 0.2; transform: scale(0.8); }

        .progress-container { width: 100%; max-width: 600px; margin-bottom: 20px; }
        .progress-bar { height: 10px; background: var(--black-light); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--orange), var(--orange-light)); border-radius: 10px; transition: width 0.5s ease; }
        .progress-text { text-align: center; margin-top: 6px; font-size: 0.85rem; color: var(--gray-dark); }

        .game-container {
            background: var(--white);
            border-radius: 24px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            border: 4px solid var(--orange);
        }

        .instruction { color: var(--gray-dark); margin-bottom: 20px; font-size: 0.95rem; }

        /* Question/Prompt Display */
        .prompt-box {
            background: linear-gradient(145deg, var(--orange), var(--orange-dark));
            color: var(--white);
            padding: 20px 25px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.3);
        }

        .prompt-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .prompt-text {
            font-size: 1.3rem;
            font-weight: 700;
            line-height: 1.4;
        }

        /* Answer Options */
        .answers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }

        .answer-btn {
            padding: 16px 12px;
            background: var(--black);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .answer-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            background: var(--orange-dark);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.3);
        }

        .answer-btn:active:not(:disabled) {
            transform: scale(0.98);
        }

        .answer-btn.correct {
            background: var(--success);
            animation: correctPop 0.4s ease;
        }

        .answer-btn.wrong {
            background: var(--danger);
            animation: shake 0.4s ease;
        }

        .answer-btn.eliminated {
            background: var(--gray);
            color: var(--gray-dark);
            cursor: default;
            opacity: 0.5;
            transform: scale(0.95);
        }

        @keyframes correctPop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        @keyframes fadeOut {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.8); }
        }

        .answer-btn.fade-out {
            animation: fadeOut 0.3s ease forwards;
        }

        /* Matched pairs list */
        .matched-section {
            margin-top: 20px;
            text-align: left;
        }

        .matched-title {
            font-size: 0.8rem;
            color: var(--gray-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-align: center;
        }

        .matched-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .matched-item {
            background: rgba(76, 175, 80, 0.15);
            border: 2px solid var(--success);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--success);
            font-weight: 600;
        }

        .btn-container { display: flex; gap: 10px; justify-content: center; }

        .btn {
            padding: 12px 28px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary { background: var(--orange); color: var(--white); }
        .btn-primary:hover { background: var(--orange-dark); transform: translateY(-2px); }
        .btn-secondary { background: var(--gray-light); color: var(--black); }
        .btn-secondary:hover { background: var(--gray); }

        /* Overlays */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .overlay.show { opacity: 1; pointer-events: all; }

        .modal {
            background: var(--white);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            max-width: 400px;
            width: 100%;
        }

        .overlay.show .modal { transform: scale(1); }

        .modal-icon { font-size: 3.5rem; margin-bottom: 15px; }
        .modal-title { font-size: 1.6rem; color: var(--black); margin-bottom: 10px; font-weight: 700; }

        .modal-stats { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
        .modal-stat { text-align: center; }
        .modal-stat-value { font-size: 1.5rem; font-weight: 700; color: var(--orange); }
        .modal-stat-label { font-size: 0.8rem; color: var(--gray-dark); }

        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--white);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 50;
        }

        @media (max-width: 500px) {
            .game-title { font-size: 1.6rem; }
            .game-container { padding: 20px; }
            .prompt-text { font-size: 1.1rem; }
            .answers-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .answer-btn { padding: 14px 10px; font-size: 0.85rem; }
            .stat-box { padding: 8px 12px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <button class="sound-toggle" id="soundToggle">🔊</button>

    <header class="header">
        <div class="logo">Speak Academy</div>
        <h1 class="game-title">Find the Match</h1>
        <p class="set-title" id="setTitle">Loading...</p>
    </header>

    <div class="stats-bar">
        <div class="stat-box">
            <div class="lives-container" id="livesContainer">
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
                <span class="heart">❤️</span>
            </div>
        </div>
        <div class="stat-box">
            <span>⭐</span>
            <span>Score:</span>
            <span class="value" id="score">0</span>
        </div>
        <div class="stat-box">
            <span>🎯</span>
            <span>Streak:</span>
            <span class="value" id="streak">0</span>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="progress-text" id="progressText">Match 1 of 10</p>
    </div>

    <main class="game-container">
        <p class="instruction">Tap the matching answer to eliminate it</p>

        <div class="prompt-box">
            <div class="prompt-label">Find the match for:</div>
            <div class="prompt-text" id="promptText">Loading...</div>
        </div>

        <div class="answers-grid" id="answersGrid"></div>

        <div class="matched-section" id="matchedSection" style="display: none;">
            <div class="matched-title">Matched</div>
            <div class="matched-list" id="matchedList"></div>
        </div>

        <div class="btn-container">
            <button class="btn btn-secondary" id="resetBtn">↺ Reset</button>
        </div>
    </main>

    <!-- Complete Modal -->
    <div class="overlay" id="completeOverlay">
        <div class="modal">
            <div class="modal-icon">🏆</div>
            <h2 class="modal-title">Round Complete!</h2>
            <div class="modal-stats">
                <div class="modal-stat">
                    <div class="modal-stat-value" id="finalScore">0</div>
                    <div class="modal-stat-label">Score</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-value" id="finalAccuracy">0%</div>
                    <div class="modal-stat-label">Accuracy</div>
                </div>
            </div>
            <button class="btn btn-primary" id="nextRoundBtn">Next Round →</button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="overlay" id="gameOverOverlay">
        <div class="modal">
            <div class="modal-icon">💔</div>
            <h2 class="modal-title">Game Over!</h2>
            <div class="modal-stats">
                <div class="modal-stat">
                    <div class="modal-stat-value" id="gameOverScore">0</div>
                    <div class="modal-stat-label">Final Score</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-value" id="gameOverMatched">0</div>
                    <div class="modal-stat-label">Matched</div>
                </div>
            </div>
            <button class="btn btn-primary" id="retryBtn">Try Again</button>
        </div>
    </div>

    <script>
        // ============ CONFIG ============
        const DEFAULT_DATA_URL = 'words/find-match.json';
        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('data') || urlParams.get('set');

        // ============ STATE ============
        let state = {
            allPairs: [],
            currentRound: [],
            currentPromptIndex: 0,
            answers: [],
            matchedPairs: [],
            eliminatedAnswers: [],
            score: 0,
            streak: 0,
            lives: 3,
            attempts: 0,
            correctAttempts: 0,
            setTitle: '',
            soundOn: true,
            isLocked: false
        };

        // ============ AUDIO ============
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!state.soundOn) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            switch(type) {
                case 'correct':
                    [523, 659, 784].forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.08);
                        g.gain.setValueAtTime(0.12, audioCtx.currentTime + i * 0.08);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.08 + 0.15);
                        o.start(audioCtx.currentTime + i * 0.08);
                        o.stop(audioCtx.currentTime + i * 0.08 + 0.15);
                    });
                    break;
                case 'wrong':
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
                    break;
                case 'complete':
                    [523, 659, 784, 1047].forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.12);
                        g.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.12);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.12 + 0.25);
                        o.start(audioCtx.currentTime + i * 0.12);
                        o.stop(audioCtx.currentTime + i * 0.12 + 0.25);
                    });
                    break;
            }
        }

        // ============ HELPERS ============
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ============ LOAD DATA ============
        async function loadData() {
            let url = DEFAULT_DATA_URL;
            if (dataParam) {
                url = dataParam.startsWith('http') ? dataParam : `words/${dataParam}.json`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                state.allPairs = data.pairs || data;
                state.setTitle = data.title || 'Find the Match';
            } catch (e) {
                state.allPairs = [
                    { prompt: "Hello", answer: "Hola" },
                    { prompt: "Goodbye", answer: "Adiós" },
                    { prompt: "Please", answer: "Por favor" },
                    { prompt: "Thank you", answer: "Gracias" },
                    { prompt: "Yes", answer: "Sí" },
                    { prompt: "No", answer: "No" },
                    { prompt: "Good morning", answer: "Buenos días" },
                    { prompt: "Good night", answer: "Buenas noches" },
                    { prompt: "How are you?", answer: "¿Cómo estás?" },
                    { prompt: "I'm fine", answer: "Estoy bien" },
                    { prompt: "What's your name?", answer: "¿Cómo te llamas?" },
                    { prompt: "My name is...", answer: "Me llamo..." }
                ];
                state.setTitle = 'English - Spanish';
            }

            document.getElementById('setTitle').textContent = state.setTitle;
            initGame();
        }

        // ============ GAME LOGIC ============
        function initGame() {
            state.score = 0;
            state.streak = 0;
            state.lives = 3;
            state.attempts = 0;
            state.correctAttempts = 0;
            
            startNewRound();
            updateUI();
            hideAllOverlays();
        }

        function startNewRound() {
            // Select pairs for this round (max 6)
            const numPairs = Math.min(6, state.allPairs.length);
            state.currentRound = shuffle([...state.allPairs]).slice(0, numPairs);
            state.currentPromptIndex = 0;
            state.matchedPairs = [];
            state.eliminatedAnswers = [];
            
            // Create shuffled answers array
            state.answers = shuffle(state.currentRound.map(pair => pair.answer));
            
            renderRound();
            updateProgress();
        }

        function renderRound() {
            // Show current prompt
            const currentPair = state.currentRound[state.currentPromptIndex];
            document.getElementById('promptText').textContent = currentPair.prompt;

            // Render answer buttons
            const grid = document.getElementById('answersGrid');
            grid.innerHTML = '';

            state.answers.forEach((answer, index) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = answer;
                btn.dataset.answer = answer;

                if (state.eliminatedAnswers.includes(answer)) {
                    btn.classList.add('eliminated');
                    btn.disabled = true;
                } else {
                    btn.addEventListener('click', () => checkAnswer(answer, btn));
                }

                grid.appendChild(btn);
            });

            // Update matched list
            renderMatchedList();
        }

        function renderMatchedList() {
            const section = document.getElementById('matchedSection');
            const list = document.getElementById('matchedList');

            if (state.matchedPairs.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            list.innerHTML = state.matchedPairs.map(pair => 
                `<span class="matched-item">${pair.prompt} = ${pair.answer}</span>`
            ).join('');
        }

        function checkAnswer(answer, btnElement) {
            if (state.isLocked) return;
            state.isLocked = true;
            state.attempts++;

            const currentPair = state.currentRound[state.currentPromptIndex];
            const isCorrect = answer === currentPair.answer;

            if (isCorrect) {
                playSound('correct');
                state.correctAttempts++;
                state.score += 10 + (state.streak * 2);
                state.streak++;
                
                btnElement.classList.add('correct');
                
                // Add to matched pairs
                state.matchedPairs.push(currentPair);
                state.eliminatedAnswers.push(answer);

                setTimeout(() => {
                    btnElement.classList.add('fade-out');
                    
                    setTimeout(() => {
                        state.currentPromptIndex++;
                        state.isLocked = false;

                        if (state.currentPromptIndex >= state.currentRound.length) {
                            // Round complete
                            roundComplete();
                        } else {
                            renderRound();
                            updateProgress();
                            updateUI();
                        }
                    }, 300);
                }, 400);

            } else {
                playSound('wrong');
                state.lives--;
                state.streak = 0;
                
                btnElement.classList.add('wrong');

                setTimeout(() => {
                    btnElement.classList.remove('wrong');
                    state.isLocked = false;

                    if (state.lives <= 0) {
                        gameOver();
                    }
                    updateUI();
                }, 500);
            }

            updateUI();
        }

        function roundComplete() {
            playSound('complete');
            
            const accuracy = Math.round((state.correctAttempts / state.attempts) * 100);
            document.getElementById('finalScore').textContent = state.score;
            document.getElementById('finalAccuracy').textContent = `${accuracy}%`;
            
            document.getElementById('completeOverlay').classList.add('show');
        }

        function gameOver() {
            playSound('wrong');
            
            document.getElementById('gameOverScore').textContent = state.score;
            document.getElementById('gameOverMatched').textContent = state.matchedPairs.length;
            
            document.getElementById('gameOverOverlay').classList.add('show');
        }

        // ============ UI UPDATES ============
        function updateUI() {
            document.getElementById('score').textContent = state.score;
            document.getElementById('streak').textContent = state.streak;
            
            // Lives
            const hearts = document.querySelectorAll('.heart');
            hearts.forEach((h, i) => h.classList.toggle('lost', i >= state.lives));
        }

        function updateProgress() {
            const total = state.currentRound.length;
            const current = state.currentPromptIndex;
            const pct = (current / total) * 100;
            
            document.getElementById('progressFill').style.width = `${pct}%`;
            document.getElementById('progressText').textContent = 
                `Match ${current + 1} of ${total}`;
        }

        function hideAllOverlays() {
            document.querySelectorAll('.overlay').forEach(o => o.classList.remove('show'));
        }

        // ============ EVENT LISTENERS ============
        document.getElementById('resetBtn').addEventListener('click', initGame);
        document.getElementById('retryBtn').addEventListener('click', initGame);
        document.getElementById('nextRoundBtn').addEventListener('click', () => {
            hideAllOverlays();
            startNewRound();
            updateUI();
        });
        document.getElementById('soundToggle').addEventListener('click', () => {
            state.soundOn = !state.soundOn;
            document.getElementById('soundToggle').textContent = state.soundOn ? '🔊' : '🔇';
        });

        // ============ INIT ============
        loadData();
    </script>
</body>
</html>
