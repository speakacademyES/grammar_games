<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking Cards | Speak Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --black: #1a1a1a;
            --black-light: #2a2a2a;
            --orange: #ff6b35;
            --orange-dark: #e55a2b;
            --orange-light: #ff8c5a;
            --white: #ffffff;
            --gray-light: #f5f5f5;
            --gray: #e0e0e0;
            --gray-dark: #888;
            --success: #4caf50;
            --info: #3b82f6;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--black) 0%, var(--black-light) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: var(--white);
        }

        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 0.9rem; font-weight: 700; color: var(--orange); letter-spacing: 3px; text-transform: uppercase; }
        .game-title { font-size: 2rem; font-weight: 800; color: var(--white); }
        .set-title { font-size: 0.9rem; color: var(--gray-dark); margin-top: 5px; }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 500px;
        }

        .stat-box {
            background: var(--black-light);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .stat-box .value {
            font-family: 'JetBrains Mono', monospace;
            color: var(--orange);
            font-weight: 700;
        }

        .game-container {
            background: var(--white);
            border-radius: 24px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            border: 4px solid var(--orange);
        }

        .instruction { color: var(--gray-dark); margin-bottom: 25px; font-size: 0.95rem; }

        /* Card Deck Area */
        .deck-area {
            position: relative;
            height: 280px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Card Deck Stack */
        .deck-stack {
            position: absolute;
            left: 30px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .deck-stack:hover {
            transform: scale(1.03);
        }

        .deck-card {
            width: 100px;
            height: 140px;
            background: linear-gradient(145deg, var(--orange), var(--orange-dark));
            border-radius: 12px;
            position: absolute;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .deck-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(145deg, rgba(255,255,255,0.2) 0%, transparent 50%);
            border-radius: 12px;
        }

        .deck-card::after {
            content: '🎴';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
        }

        .deck-card:nth-child(1) { top: 0; left: 0; }
        .deck-card:nth-child(2) { top: 3px; left: 3px; }
        .deck-card:nth-child(3) { top: 6px; left: 6px; }

        .deck-count {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: var(--gray-dark);
            white-space: nowrap;
        }

        /* Active Card */
        .active-card {
            width: 200px;
            height: 260px;
            background: var(--white);
            border: 4px solid var(--orange);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-shadow: 0 10px 40px rgba(255, 107, 53, 0.3);
            position: relative;
            transition: all 0.3s ease;
        }

        .active-card.dealing {
            animation: dealCard 0.4s ease;
        }

        @keyframes dealCard {
            0% {
                transform: translateX(-150px) rotate(-20deg);
                opacity: 0;
            }
            100% {
                transform: translateX(0) rotate(0deg);
                opacity: 1;
            }
        }

        .active-card.empty {
            border-style: dashed;
            border-color: var(--gray);
        }

        .card-category {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: var(--white);
            background: var(--orange);
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .card-content {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--black);
            text-align: center;
            line-height: 1.5;
            padding: 10px;
        }

        .card-number {
            position: absolute;
            bottom: 12px;
            right: 15px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--gray-dark);
        }

        .empty-message {
            color: var(--gray-dark);
            font-style: italic;
        }

        /* Dealt Cards Pile */
        .dealt-pile {
            position: absolute;
            right: 30px;
            opacity: 0.4;
        }

        .dealt-card {
            width: 100px;
            height: 140px;
            background: var(--gray);
            border-radius: 12px;
            position: absolute;
        }

        .dealt-card:nth-child(1) { top: 0; left: 0; transform: rotate(-5deg); }
        .dealt-card:nth-child(2) { top: 2px; left: 2px; transform: rotate(3deg); }

        .dealt-count {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: var(--gray-dark);
            white-space: nowrap;
        }

        /* Buttons */
        .btn-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 32px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--orange);
            color: var(--white);
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--orange-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--gray-light);
            color: var(--black);
        }

        .btn-secondary:hover {
            background: var(--gray);
        }

        /* History */
        .history-section {
            margin-top: 25px;
            text-align: left;
        }

        .history-title {
            font-size: 0.8rem;
            color: var(--gray-dark);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-align: center;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 150px;
            overflow-y: auto;
        }

        .history-item {
            background: var(--gray-light);
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--black);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-number {
            background: var(--orange);
            color: var(--white);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .history-text {
            flex: 1;
            line-height: 1.3;
        }

        /* Settings Modal */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .overlay.show { opacity: 1; pointer-events: all; }

        .modal {
            background: var(--white);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .overlay.show .modal { transform: scale(1); }

        .modal-icon { font-size: 3.5rem; margin-bottom: 15px; }
        .modal-title { font-size: 1.4rem; color: var(--black); margin-bottom: 15px; font-weight: 700; }
        .modal-text { color: var(--gray-dark); margin-bottom: 20px; }

        .modal-input {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 2px solid var(--gray);
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            resize: vertical;
            margin-bottom: 15px;
        }

        .modal-input:focus {
            outline: none;
            border-color: var(--orange);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--white);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 50;
        }

        .settings-btn {
            position: fixed;
            top: 20px;
            right: 75px;
            background: var(--white);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 50;
        }

        @media (max-width: 500px) {
            .game-title { font-size: 1.6rem; }
            .game-container { padding: 20px; }
            .deck-area { height: 240px; }
            .active-card { width: 160px; height: 220px; }
            .deck-stack { left: 10px; }
            .dealt-pile { right: 10px; }
            .deck-card, .dealt-card { width: 80px; height: 112px; }
            .card-content { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <button class="settings-btn" id="settingsBtn">⚙️</button>
    <button class="sound-toggle" id="soundToggle">🔊</button>

    <header class="header">
        <div class="logo">Speak Academy</div>
        <h1 class="game-title">Speaking Cards</h1>
        <p class="set-title" id="setTitle">Loading...</p>
    </header>

    <div class="stats-bar">
        <div class="stat-box">
            <span>🎴</span>
            <span>Remaining:</span>
            <span class="value" id="remaining">0</span>
        </div>
        <div class="stat-box">
            <span>✓</span>
            <span>Dealt:</span>
            <span class="value" id="dealt">0</span>
        </div>
    </div>

    <main class="game-container">
        <p class="instruction">Draw a card and discuss the topic</p>

        <div class="deck-area">
            <!-- Deck Stack -->
            <div class="deck-stack" id="deckStack">
                <div class="deck-card"></div>
                <div class="deck-card"></div>
                <div class="deck-card"></div>
                <div class="deck-count" id="deckCount">0 cards</div>
            </div>

            <!-- Active Card -->
            <div class="active-card empty" id="activeCard">
                <span class="empty-message">Tap the deck to draw a card</span>
            </div>

            <!-- Dealt Pile -->
            <div class="dealt-pile" id="dealtPile" style="display: none;">
                <div class="dealt-card"></div>
                <div class="dealt-card"></div>
                <div class="dealt-count" id="dealtCount">0 dealt</div>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn btn-secondary" id="shuffleBtn">🔀 Shuffle</button>
            <button class="btn btn-primary" id="drawBtn">Draw Card</button>
        </div>

        <div class="history-section" id="historySection" style="display: none;">
            <div class="history-title">Recent Cards</div>
            <div class="history-list" id="historyList"></div>
        </div>
    </main>

    <!-- Empty Deck Modal -->
    <div class="overlay" id="emptyOverlay">
        <div class="modal">
            <div class="modal-icon">🎉</div>
            <h2 class="modal-title">All Cards Dealt!</h2>
            <p class="modal-text">You've gone through all the cards. Shuffle to start again?</p>
            <div class="modal-buttons">
                <button class="btn btn-primary" id="reshuffleBtn">🔀 Shuffle & Restart</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="overlay" id="settingsOverlay">
        <div class="modal">
            <h2 class="modal-title">Edit Cards</h2>
            <textarea class="modal-input" id="cardsInput" placeholder="Enter prompts, one per line..."></textarea>
            <p style="font-size: 0.8rem; color: var(--gray-dark); margin-bottom: 20px;">Enter each speaking prompt on a new line.</p>
            <div class="modal-buttons">
                <button class="btn btn-secondary" id="cancelBtn">Cancel</button>
                <button class="btn btn-primary" id="saveBtn">Save</button>
            </div>
        </div>
    </div>

    <script>
        // ============ CONFIG ============
        const DEFAULT_CARDS_URL = 'words/speaking-cards.json';
        const urlParams = new URLSearchParams(window.location.search);
        const cardsParam = urlParams.get('cards') || urlParams.get('set');

        // ============ STATE ============
        let state = {
            allCards: [],
            deck: [],
            dealt: [],
            currentCard: null,
            setTitle: '',
            category: '',
            soundOn: true
        };

        // ============ AUDIO ============
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!state.soundOn) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            switch(type) {
                case 'draw':
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                    break;
                case 'shuffle':
                    [400, 500, 450, 550, 500].forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.05);
                        g.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.05);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.05 + 0.08);
                        o.start(audioCtx.currentTime + i * 0.05);
                        o.stop(audioCtx.currentTime + i * 0.05 + 0.08);
                    });
                    break;
                case 'complete':
                    [523, 659, 784, 1047].forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.12);
                        g.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.12);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.12 + 0.25);
                        o.start(audioCtx.currentTime + i * 0.12);
                        o.stop(audioCtx.currentTime + i * 0.12 + 0.25);
                    });
                    break;
            }
        }

        // ============ HELPERS ============
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // ============ LOAD CARDS ============
        async function loadCards() {
            let url = DEFAULT_CARDS_URL;
            if (cardsParam) {
                url = cardsParam.startsWith('http') ? cardsParam : `words/${cardsParam}.json`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                state.allCards = data.cards || data.prompts || data;
                state.setTitle = data.title || 'Speaking Practice';
                state.category = data.category || 'Topic';
            } catch (e) {
                state.allCards = [
                    "What did you do last weekend?",
                    "Describe your favorite place to visit.",
                    "What would you do with a million dollars?",
                    "Tell me about your best friend.",
                    "What's your favorite food and why?",
                    "Describe your morning routine.",
                    "What are your plans for the future?",
                    "Tell me about a memorable trip.",
                    "What's your favorite movie or TV show?",
                    "Describe your ideal vacation.",
                    "What hobbies do you enjoy?",
                    "Tell me about your family.",
                    "What's something you're proud of?",
                    "Describe your hometown.",
                    "What would your dream job be?"
                ];
                state.setTitle = 'Conversation Starters';
                state.category = 'Question';
            }

            document.getElementById('setTitle').textContent = state.setTitle;
            document.getElementById('cardsInput').value = state.allCards.join('\n');
            initDeck();
        }

        // ============ GAME LOGIC ============
        function initDeck() {
            state.deck = shuffle([...state.allCards]);
            state.dealt = [];
            state.currentCard = null;
            
            updateUI();
            resetActiveCard();
            hideAllOverlays();
        }

        function drawCard() {
            if (state.deck.length === 0) {
                playSound('complete');
                document.getElementById('emptyOverlay').classList.add('show');
                return;
            }

            playSound('draw');

            // Draw from deck
            const card = state.deck.pop();
            state.currentCard = card;
            state.dealt.push(card);

            // Animate card
            const activeCard = document.getElementById('activeCard');
            activeCard.classList.remove('empty');
            activeCard.classList.remove('dealing');
            void activeCard.offsetWidth; // Trigger reflow
            activeCard.classList.add('dealing');

            activeCard.innerHTML = `
                <span class="card-category">${state.category}</span>
                <div class="card-content">${card}</div>
                <span class="card-number">${state.dealt.length} / ${state.allCards.length}</span>
            `;

            updateUI();
            updateHistory();
        }

        function resetActiveCard() {
            const activeCard = document.getElementById('activeCard');
            activeCard.classList.add('empty');
            activeCard.classList.remove('dealing');
            activeCard.innerHTML = '<span class="empty-message">Tap the deck to draw a card</span>';
        }

        function shuffleDeck() {
            playSound('shuffle');
            initDeck();
        }

        // ============ UI UPDATES ============
        function updateUI() {
            document.getElementById('remaining').textContent = state.deck.length;
            document.getElementById('dealt').textContent = state.dealt.length;
            document.getElementById('deckCount').textContent = `${state.deck.length} cards`;
            document.getElementById('dealtCount').textContent = `${state.dealt.length} dealt`;

            // Show/hide deck stack based on remaining cards
            const deckStack = document.getElementById('deckStack');
            deckStack.style.opacity = state.deck.length > 0 ? '1' : '0.3';
            deckStack.style.pointerEvents = state.deck.length > 0 ? 'auto' : 'none';

            // Show dealt pile if cards have been dealt
            document.getElementById('dealtPile').style.display = 
                state.dealt.length > 0 ? 'block' : 'none';

            // Disable draw button if deck is empty
            document.getElementById('drawBtn').disabled = state.deck.length === 0;
        }

        function updateHistory() {
            const section = document.getElementById('historySection');
            const list = document.getElementById('historyList');

            if (state.dealt.length <= 1) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            
            // Show last 5 cards (excluding current)
            const recentCards = state.dealt.slice(0, -1).reverse().slice(0, 5);
            
            list.innerHTML = recentCards.map((card, index) => `
                <div class="history-item">
                    <span class="history-number">${state.dealt.length - 1 - index}</span>
                    <span class="history-text">${card}</span>
                </div>
            `).join('');
        }

        function hideAllOverlays() {
            document.querySelectorAll('.overlay').forEach(o => o.classList.remove('show'));
        }

        // ============ SETTINGS ============
        function openSettings() {
            document.getElementById('cardsInput').value = state.allCards.join('\n');
            document.getElementById('settingsOverlay').classList.add('show');
        }

        function closeSettings() {
            document.getElementById('settingsOverlay').classList.remove('show');
        }

        function saveSettings() {
            const input = document.getElementById('cardsInput').value;
            const newCards = input.split('\n')
                .map(card => card.trim())
                .filter(card => card.length > 0);

            if (newCards.length < 1) {
                alert('Please enter at least 1 card');
                return;
            }

            state.allCards = newCards;
            initDeck();
            closeSettings();
        }

        // ============ EVENT LISTENERS ============
        document.getElementById('drawBtn').addEventListener('click', drawCard);
        document.getElementById('deckStack').addEventListener('click', drawCard);
        document.getElementById('shuffleBtn').addEventListener('click', shuffleDeck);
        document.getElementById('reshuffleBtn').addEventListener('click', () => {
            shuffleDeck();
            hideAllOverlays();
        });
        document.getElementById('settingsBtn').addEventListener('click', openSettings);
        document.getElementById('cancelBtn').addEventListener('click', closeSettings);
        document.getElementById('saveBtn').addEventListener('click', saveSettings);
        document.getElementById('soundToggle').addEventListener('click', () => {
            state.soundOn = !state.soundOn;
            document.getElementById('soundToggle').textContent = state.soundOn ? '🔊' : '🔇';
        });

        document.getElementById('settingsOverlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('settingsOverlay')) {
                closeSettings();
            }
        });

        // ============ INIT ============
        loadCards();
    </script>
</body>
</html>
