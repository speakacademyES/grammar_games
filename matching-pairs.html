<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching Pairs | Speak Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --black: #1a1a1a;
            --black-light: #2a2a2a;
            --orange: #ff6b35;
            --orange-dark: #e55a2b;
            --orange-light: #ff8c5a;
            --white: #ffffff;
            --gray-light: #f5f5f5;
            --gray: #e0e0e0;
            --gray-dark: #888;
            --success: #4caf50;
            --info: #3b82f6;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--black) 0%, var(--black-light) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: var(--white);
        }

        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 0.9rem; font-weight: 700; color: var(--orange); letter-spacing: 3px; text-transform: uppercase; }
        .game-title { font-size: 2rem; font-weight: 800; color: var(--white); }
        .set-title { font-size: 0.9rem; color: var(--gray-dark); margin-top: 5px; }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 600px;
        }

        .stat-box {
            background: var(--black-light);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .stat-box .value {
            font-family: 'JetBrains Mono', monospace;
            color: var(--orange);
            font-weight: 700;
        }

        .game-container {
            background: var(--white);
            border-radius: 24px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            border: 4px solid var(--orange);
        }

        .instruction { color: var(--gray-dark); margin-bottom: 20px; font-size: 0.95rem; }

        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        /* Card */
        .card {
            aspect-ratio: 1;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s ease;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .card-front {
            background: linear-gradient(145deg, var(--orange), var(--orange-dark));
            color: var(--white);
            font-size: 2rem;
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .card-front::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(145deg, rgba(255,255,255,0.2) 0%, transparent 50%);
            border-radius: 12px;
        }

        .card-back {
            background: var(--white);
            border: 3px solid var(--gray);
            transform: rotateY(180deg);
            padding: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--black);
            word-break: break-word;
        }

        .card-back.english {
            border-color: var(--info);
            background: rgba(59, 130, 246, 0.1);
        }

        .card-back.spanish {
            border-color: var(--warning);
            background: rgba(245, 158, 11, 0.1);
        }

        .card.matched .card-back {
            border-color: var(--success);
            background: rgba(76, 175, 80, 0.15);
        }

        .card.matched {
            pointer-events: none;
        }

        .card:hover:not(.flipped):not(.matched) .card-front {
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.5);
        }

        /* Legend */
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 0.85rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--gray-dark);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .legend-dot.english { background: var(--info); }
        .legend-dot.spanish { background: var(--warning); }

        .btn-container { display: flex; gap: 10px; justify-content: center; }

        .btn {
            padding: 12px 28px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary { background: var(--orange); color: var(--white); }
        .btn-primary:hover { background: var(--orange-dark); transform: translateY(-2px); }
        .btn-secondary { background: var(--gray-light); color: var(--black); }
        .btn-secondary:hover { background: var(--gray); }

        /* Overlays */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .overlay.show { opacity: 1; pointer-events: all; }

        .modal {
            background: var(--white);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            max-width: 400px;
            width: 100%;
        }

        .overlay.show .modal { transform: scale(1); }

        .modal-icon { font-size: 3.5rem; margin-bottom: 15px; }
        .modal-title { font-size: 1.6rem; color: var(--black); margin-bottom: 10px; font-weight: 700; }

        .modal-stats { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
        .modal-stat { text-align: center; }
        .modal-stat-value { font-size: 1.5rem; font-weight: 700; color: var(--orange); }
        .modal-stat-label { font-size: 0.8rem; color: var(--gray-dark); }

        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--white);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 50;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.3s ease; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .pulse { animation: pulse 0.4s ease; }

        @media (max-width: 500px) {
            .game-title { font-size: 1.6rem; }
            .game-container { padding: 20px; }
            .cards-grid { gap: 8px; }
            .card-back { font-size: 0.75rem; padding: 5px; }
            .card-front { font-size: 1.5rem; }
            .stat-box { padding: 8px 12px; font-size: 0.8rem; }
        }

        @media (max-width: 380px) {
            .cards-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <button class="sound-toggle" id="soundToggle">🔊</button>

    <header class="header">
        <div class="logo">Speak Academy</div>
        <h1 class="game-title">Matching Pairs</h1>
        <p class="set-title" id="setTitle">Loading...</p>
    </header>

    <div class="stats-bar">
        <div class="stat-box">
            <span>🎯</span>
            <span>Pairs:</span>
            <span class="value" id="pairsFound">0 / 8</span>
        </div>
        <div class="stat-box">
            <span>👆</span>
            <span>Moves:</span>
            <span class="value" id="moves">0</span>
        </div>
        <div class="stat-box">
            <span>⏱️</span>
            <span class="value" id="timer">0:00</span>
        </div>
    </div>

    <main class="game-container">
        <p class="instruction">Find matching English-Spanish word pairs</p>

        <div class="legend">
            <div class="legend-item">
                <span class="legend-dot english"></span>
                <span>English</span>
            </div>
            <div class="legend-item">
                <span class="legend-dot spanish"></span>
                <span>Spanish</span>
            </div>
        </div>

        <div class="cards-grid" id="cardsGrid"></div>

        <div class="btn-container">
            <button class="btn btn-secondary" id="resetBtn">↺ New Game</button>
        </div>
    </main>

    <!-- Complete Modal -->
    <div class="overlay" id="completeOverlay">
        <div class="modal">
            <div class="modal-icon">🏆</div>
            <h2 class="modal-title">Well Done!</h2>
            <div class="modal-stats">
                <div class="modal-stat">
                    <div class="modal-stat-value" id="finalMoves">0</div>
                    <div class="modal-stat-label">Moves</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-value" id="finalTime">0:00</div>
                    <div class="modal-stat-label">Time</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-value" id="finalStars">⭐⭐⭐</div>
                    <div class="modal-stat-label">Rating</div>
                </div>
            </div>
            <button class="btn btn-primary" id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <script>
        // ============ CONFIG ============
        const DEFAULT_PAIRS_URL = 'words/matching-pairs.json';
        const urlParams = new URLSearchParams(window.location.search);
        const pairsParam = urlParams.get('pairs') || urlParams.get('set');

        // ============ STATE ============
        let state = {
            pairs: [],
            cards: [],
            setTitle: '',
            flippedCards: [],
            matchedPairs: 0,
            totalPairs: 8,
            moves: 0,
            startTime: null,
            timerInterval: null,
            isLocked: false,
            soundOn: true
        };

        // ============ AUDIO ============
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!state.soundOn) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            switch(type) {
                case 'flip':
                    osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                    break;
                case 'match':
                    [523, 659, 784].forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.1);
                        g.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.2);
                        o.start(audioCtx.currentTime + i * 0.1);
                        o.stop(audioCtx.currentTime + i * 0.1 + 0.2);
                    });
                    break;
                case 'noMatch':
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                    break;
                case 'complete':
                    [523, 659, 784, 1047].forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.15);
                        g.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.15);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.15 + 0.3);
                        o.start(audioCtx.currentTime + i * 0.15);
                        o.stop(audioCtx.currentTime + i * 0.15 + 0.3);
                    });
                    break;
            }
        }

        // ============ HELPERS ============
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        // ============ LOAD PAIRS ============
        async function loadPairs() {
            let url = DEFAULT_PAIRS_URL;
            if (pairsParam) {
                url = pairsParam.startsWith('http') ? pairsParam : `words/${pairsParam}.json`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                state.pairs = data.pairs || data;
                state.setTitle = data.title || 'Vocabulary';
            } catch (e) {
                state.pairs = [
                    { english: "House", spanish: "Casa" },
                    { english: "Dog", spanish: "Perro" },
                    { english: "Cat", spanish: "Gato" },
                    { english: "Water", spanish: "Agua" },
                    { english: "Food", spanish: "Comida" },
                    { english: "Book", spanish: "Libro" },
                    { english: "School", spanish: "Escuela" },
                    { english: "Friend", spanish: "Amigo" },
                    { english: "Family", spanish: "Familia" },
                    { english: "Time", spanish: "Tiempo" },
                    { english: "Day", spanish: "Día" },
                    { english: "Night", spanish: "Noche" }
                ];
                state.setTitle = 'Basic Vocabulary';
            }

            document.getElementById('setTitle').textContent = state.setTitle;
        }

        // ============ GAME LOGIC ============
        function initGame() {
            // Reset state
            state.flippedCards = [];
            state.matchedPairs = 0;
            state.moves = 0;
            state.isLocked = false;
            state.totalPairs = Math.min(8, state.pairs.length);

            // Select random pairs
            const selectedPairs = shuffle(state.pairs).slice(0, state.totalPairs);

            // Create cards array (one English, one Spanish per pair)
            state.cards = [];
            selectedPairs.forEach((pair, index) => {
                state.cards.push({
                    id: index * 2,
                    pairId: index,
                    word: pair.english,
                    lang: 'english'
                });
                state.cards.push({
                    id: index * 2 + 1,
                    pairId: index,
                    word: pair.spanish,
                    lang: 'spanish'
                });
            });

            // Shuffle cards
            state.cards = shuffle(state.cards);

            // Start timer
            state.startTime = Date.now();
            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(updateTimer, 1000);

            // Render
            renderCards();
            updateStats();
            hideOverlay();
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            state.cards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.dataset.index = index;

                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">?</div>
                        <div class="card-back ${card.lang}">${card.word}</div>
                    </div>
                `;

                cardEl.addEventListener('click', () => flipCard(index));
                grid.appendChild(cardEl);
            });
        }

        function flipCard(index) {
            if (state.isLocked) return;

            const card = state.cards[index];
            const cardEl = document.querySelectorAll('.card')[index];

            // Don't flip if already flipped or matched
            if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) {
                return;
            }

            // Don't flip more than 2 cards
            if (state.flippedCards.length >= 2) return;

            playSound('flip');
            cardEl.classList.add('flipped');
            state.flippedCards.push({ index, card });

            // Check for match when 2 cards are flipped
            if (state.flippedCards.length === 2) {
                state.moves++;
                updateStats();
                checkMatch();
            }
        }

        function checkMatch() {
            const [first, second] = state.flippedCards;

            // Check if same pair AND different languages
            if (first.card.pairId === second.card.pairId && first.card.lang !== second.card.lang) {
                // Match!
                playSound('match');
                state.matchedPairs++;

                const cards = document.querySelectorAll('.card');
                cards[first.index].classList.add('matched', 'pulse');
                cards[second.index].classList.add('matched', 'pulse');

                state.flippedCards = [];
                updateStats();

                if (state.matchedPairs === state.totalPairs) {
                    setTimeout(gameComplete, 500);
                }
            } else {
                // No match
                playSound('noMatch');
                state.isLocked = true;

                const cards = document.querySelectorAll('.card');
                cards[first.index].classList.add('shake');
                cards[second.index].classList.add('shake');

                setTimeout(() => {
                    cards[first.index].classList.remove('flipped', 'shake');
                    cards[second.index].classList.remove('flipped', 'shake');
                    state.flippedCards = [];
                    state.isLocked = false;
                }, 1000);
            }
        }

        function gameComplete() {
            clearInterval(state.timerInterval);
            playSound('complete');

            const elapsed = Math.floor((Date.now() - state.startTime) / 1000);

            // Calculate stars based on moves
            const perfectMoves = state.totalPairs; // Best case
            let stars = 3;
            if (state.moves > perfectMoves * 2) stars = 2;
            if (state.moves > perfectMoves * 3) stars = 1;

            document.getElementById('finalMoves').textContent = state.moves;
            document.getElementById('finalTime').textContent = formatTime(elapsed);
            document.getElementById('finalStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);

            document.getElementById('completeOverlay').classList.add('show');
        }

        function updateStats() {
            document.getElementById('pairsFound').textContent = `${state.matchedPairs} / ${state.totalPairs}`;
            document.getElementById('moves').textContent = state.moves;
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - state.startTime) / 1000);
            document.getElementById('timer').textContent = formatTime(elapsed);
        }

        function hideOverlay() {
            document.getElementById('completeOverlay').classList.remove('show');
        }

        // ============ EVENT LISTENERS ============
        document.getElementById('resetBtn').addEventListener('click', initGame);
        document.getElementById('playAgainBtn').addEventListener('click', initGame);
        document.getElementById('soundToggle').addEventListener('click', () => {
            state.soundOn = !state.soundOn;
            document.getElementById('soundToggle').textContent = state.soundOn ? '🔊' : '🔇';
        });

        // ============ INIT ============
        loadPairs().then(initGame);
    </script>
</body>
</html>
