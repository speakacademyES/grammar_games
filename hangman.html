<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman | Speak Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --black: #1a1a1a;
            --black-light: #2a2a2a;
            --orange: #ff6b35;
            --orange-dark: #e55a2b;
            --orange-light: #ff8c5a;
            --white: #ffffff;
            --gray-light: #f5f5f5;
            --gray: #e0e0e0;
            --gray-dark: #888;
            --success: #4caf50;
            --danger: #ef4444;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--black) 0%, var(--black-light) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: var(--white);
        }

        .header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 0.9rem; font-weight: 700; color: var(--orange); letter-spacing: 3px; text-transform: uppercase; }
        .game-title { font-size: 2rem; font-weight: 800; color: var(--white); }
        .set-title { font-size: 0.9rem; color: var(--gray-dark); margin-top: 5px; }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 600px;
        }

        .stat-box {
            background: var(--black-light);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .stat-box .value {
            font-family: 'JetBrains Mono', monospace;
            color: var(--orange);
            font-weight: 700;
        }

        .game-container {
            background: var(--white);
            border-radius: 24px;
            padding: 30px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            border: 4px solid var(--orange);
        }

        /* Hint */
        .hint-box {
            background: var(--gray-light);
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: var(--gray-dark);
        }

        .hint-box strong {
            color: var(--black);
        }

        /* Hangman Drawing */
        .hangman-container {
            margin-bottom: 25px;
        }

        .hangman-svg {
            width: 180px;
            height: 200px;
        }

        .hangman-svg .gallows {
            stroke: var(--gray-dark);
            stroke-width: 6;
            stroke-linecap: round;
            fill: none;
        }

        .hangman-part {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .hangman-part.show {
            opacity: 1;
        }

        /* Colorful character */
        .head-circle {
            fill: #ffdc7d;
            stroke: #e8a42c;
            stroke-width: 3;
        }

        .face-features {
            fill: none;
            stroke: #4a3520;
            stroke-width: 2;
            stroke-linecap: round;
        }

        .body-part {
            stroke: #ff6b35;
            stroke-width: 5;
            stroke-linecap: round;
            fill: none;
        }

        .arm-part {
            stroke: #ffdc7d;
            stroke-width: 5;
            stroke-linecap: round;
            fill: none;
        }

        .leg-part {
            stroke: #3b82f6;
            stroke-width: 6;
            stroke-linecap: round;
            fill: none;
        }

        .shoe {
            fill: #4a3520;
        }

        .eye {
            fill: #4a3520;
        }

        .mouth-happy {
            stroke: #e85d5d;
            stroke-width: 2;
            fill: none;
        }

        .mouth-worried {
            stroke: #e85d5d;
            stroke-width: 2;
            fill: none;
        }

        .cheek {
            fill: #ffb3b3;
            opacity: 0.6;
        }

        .hair {
            stroke: #4a3520;
            stroke-width: 3;
            stroke-linecap: round;
            fill: none;
        }

        /* Word Display */
        .word-display {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
        }

        .letter-slot {
            width: 32px;
            height: 42px;
            border-bottom: 3px solid var(--black);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--black);
            text-transform: uppercase;
        }

        .letter-slot.revealed {
            color: var(--orange);
            animation: popIn 0.3s ease;
        }

        .letter-slot.space {
            border-bottom: none;
            width: 25px;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Keyboard */
        .keyboard {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .key-btn {
            width: 38px;
            height: 46px;
            border: none;
            border-radius: 8px;
            background: var(--black);
            color: var(--white);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .key-btn:hover:not(:disabled) {
            background: var(--orange);
            transform: translateY(-2px);
        }

        .key-btn:disabled {
            cursor: default;
        }

        .key-btn.correct {
            background: var(--success);
        }

        .key-btn.wrong {
            background: var(--danger);
            opacity: 0.5;
        }

        /* Buttons */
        .btn-container {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 12px 28px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary { background: var(--orange); color: var(--white); }
        .btn-primary:hover { background: var(--orange-dark); transform: translateY(-2px); }
        .btn-secondary { background: var(--gray-light); color: var(--black); }
        .btn-secondary:hover { background: var(--gray); }

        /* Overlays */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .overlay.show { opacity: 1; pointer-events: all; }

        .modal {
            background: var(--white);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            max-width: 400px;
            width: 100%;
        }

        .overlay.show .modal { transform: scale(1); }

        .modal-icon { font-size: 3.5rem; margin-bottom: 15px; }
        .modal-title { font-size: 1.6rem; color: var(--black); margin-bottom: 10px; font-weight: 700; }
        .modal-word { font-family: 'JetBrains Mono', monospace; font-size: 1.3rem; color: var(--orange); margin-bottom: 20px; font-weight: 700; text-transform: uppercase; }

        .modal-stats { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
        .modal-stat { text-align: center; }
        .modal-stat-value { font-size: 1.5rem; font-weight: 700; color: var(--orange); }
        .modal-stat-label { font-size: 0.8rem; color: var(--gray-dark); }

        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--white);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 50;
        }

        @media (max-width: 500px) {
            .game-title { font-size: 1.6rem; }
            .game-container { padding: 20px; }
            .key-btn { width: 30px; height: 38px; font-size: 0.85rem; }
            .letter-slot { width: 26px; height: 36px; font-size: 1.1rem; }
            .stat-box { padding: 8px 12px; font-size: 0.8rem; }
            .word-display { gap: 4px; }
        }
    </style>
</head>
<body>
    <button class="sound-toggle" id="soundToggle">🔊</button>

    <header class="header">
        <div class="logo">Speak Academy</div>
        <h1 class="game-title">Hangman</h1>
        <p class="set-title" id="setTitle">Loading...</p>
    </header>

    <div class="stats-bar">
        <div class="stat-box">
            <span>⭐</span>
            <span>Score:</span>
            <span class="value" id="score">0</span>
        </div>
        <div class="stat-box">
            <span>🎯</span>
            <span>Words:</span>
            <span class="value" id="wordsWon">0</span>
        </div>
        <div class="stat-box">
            <span>❌</span>
            <span>Left:</span>
            <span class="value" id="attemptsLeft">6</span>
        </div>
    </div>

    <main class="game-container">
        <div class="hint-box" id="hintBox">
            <strong>Hint:</strong> <span id="hintText">Loading...</span>
        </div>

        <div class="hangman-container">
            <svg class="hangman-svg" viewBox="0 0 180 200">
                <!-- Gallows -->
                <line class="gallows" x1="20" y1="190" x2="100" y2="190"/>
                <line class="gallows" x1="60" y1="190" x2="60" y2="20"/>
                <line class="gallows" x1="60" y1="20" x2="130" y2="20"/>
                <line class="gallows" x1="130" y1="20" x2="130" y2="35"/>
                
                <!-- Head with face -->
                <g class="hangman-part" id="head">
                    <circle class="head-circle" cx="130" cy="55" r="20"/>
                    <!-- Hair -->
                    <path class="hair" d="M115 42 Q120 35 125 42"/>
                    <path class="hair" d="M125 38 Q130 30 135 38"/>
                    <path class="hair" d="M135 42 Q140 35 145 42"/>
                    <!-- Eyes - will change based on state -->
                    <circle class="eye" id="leftEye" cx="122" cy="52" r="3"/>
                    <circle class="eye" id="rightEye" cx="138" cy="52" r="3"/>
                    <!-- Cheeks -->
                    <circle class="cheek" cx="115" cy="60" r="4"/>
                    <circle class="cheek" cx="145" cy="60" r="4"/>
                    <!-- Mouth - happy by default -->
                    <path class="mouth-happy" id="mouth" d="M122 65 Q130 72 138 65"/>
                </g>
                
                <!-- Body (orange shirt) -->
                <g class="hangman-part" id="body">
                    <line class="body-part" x1="130" y1="75" x2="130" y2="120"/>
                    <!-- Shirt detail -->
                    <line class="body-part" x1="125" y1="85" x2="135" y2="85" style="stroke-width: 2"/>
                </g>
                
                <!-- Left Arm (skin color, waving) -->
                <g class="hangman-part" id="leftArm">
                    <path class="arm-part" d="M130 85 Q110 80 100 95"/>
                    <!-- Hand -->
                    <circle cx="98" cy="97" r="5" fill="#ffdc7d" stroke="#e8a42c" stroke-width="2"/>
                </g>
                
                <!-- Right Arm -->
                <g class="hangman-part" id="rightArm">
                    <path class="arm-part" d="M130 85 Q150 80 160 95"/>
                    <!-- Hand -->
                    <circle cx="162" cy="97" r="5" fill="#ffdc7d" stroke="#e8a42c" stroke-width="2"/>
                </g>
                
                <!-- Left Leg (blue jeans) -->
                <g class="hangman-part" id="leftLeg">
                    <line class="leg-part" x1="130" y1="120" x2="110" y2="160"/>
                    <!-- Shoe -->
                    <ellipse class="shoe" cx="106" cy="163" rx="8" ry="5"/>
                </g>
                
                <!-- Right Leg -->
                <g class="hangman-part" id="rightLeg">
                    <line class="leg-part" x1="130" y1="120" x2="150" y2="160"/>
                    <!-- Shoe -->
                    <ellipse class="shoe" cx="154" cy="163" rx="8" ry="5"/>
                </g>
            </svg>
        </div>

        <div class="word-display" id="wordDisplay"></div>

        <div class="keyboard" id="keyboard">
            <div class="keyboard-row">
                <button class="key-btn" data-key="q">Q</button>
                <button class="key-btn" data-key="w">W</button>
                <button class="key-btn" data-key="e">E</button>
                <button class="key-btn" data-key="r">R</button>
                <button class="key-btn" data-key="t">T</button>
                <button class="key-btn" data-key="y">Y</button>
                <button class="key-btn" data-key="u">U</button>
                <button class="key-btn" data-key="i">I</button>
                <button class="key-btn" data-key="o">O</button>
                <button class="key-btn" data-key="p">P</button>
            </div>
            <div class="keyboard-row">
                <button class="key-btn" data-key="a">A</button>
                <button class="key-btn" data-key="s">S</button>
                <button class="key-btn" data-key="d">D</button>
                <button class="key-btn" data-key="f">F</button>
                <button class="key-btn" data-key="g">G</button>
                <button class="key-btn" data-key="h">H</button>
                <button class="key-btn" data-key="j">J</button>
                <button class="key-btn" data-key="k">K</button>
                <button class="key-btn" data-key="l">L</button>
            </div>
            <div class="keyboard-row">
                <button class="key-btn" data-key="z">Z</button>
                <button class="key-btn" data-key="x">X</button>
                <button class="key-btn" data-key="c">C</button>
                <button class="key-btn" data-key="v">V</button>
                <button class="key-btn" data-key="b">B</button>
                <button class="key-btn" data-key="n">N</button>
                <button class="key-btn" data-key="m">M</button>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn btn-secondary" id="skipBtn">⏭️ Skip Word</button>
        </div>
    </main>

    <!-- Win Modal -->
    <div class="overlay" id="winOverlay">
        <div class="modal">
            <div class="modal-icon">🎉</div>
            <h2 class="modal-title">Correct!</h2>
            <p class="modal-word" id="winWord"></p>
            <div class="modal-stats">
                <div class="modal-stat">
                    <div class="modal-stat-value" id="winScore">+0</div>
                    <div class="modal-stat-label">Points</div>
                </div>
            </div>
            <button class="btn btn-primary" id="nextWordBtn">Next Word →</button>
        </div>
    </div>

    <!-- Lose Modal -->
    <div class="overlay" id="loseOverlay">
        <div class="modal">
            <div class="modal-icon">😵</div>
            <h2 class="modal-title">Oh no!</h2>
            <p style="color: var(--gray-dark); margin-bottom: 10px;">The word was:</p>
            <p class="modal-word" id="loseWord"></p>
            <button class="btn btn-primary" id="tryAgainBtn">Next Word →</button>
        </div>
    </div>

    <!-- Game Complete Modal -->
    <div class="overlay" id="completeOverlay">
        <div class="modal">
            <div class="modal-icon">🏆</div>
            <h2 class="modal-title">All Words Done!</h2>
            <div class="modal-stats">
                <div class="modal-stat">
                    <div class="modal-stat-value" id="finalScore">0</div>
                    <div class="modal-stat-label">Score</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-value" id="finalWords">0</div>
                    <div class="modal-stat-label">Words</div>
                </div>
            </div>
            <button class="btn btn-primary" id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <script>
        const DEFAULT_DATA_URL = 'words/hangman.json';
        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('data') || urlParams.get('set');

        const HANGMAN_PARTS = ['head', 'body', 'leftArm', 'rightArm', 'leftLeg', 'rightLeg'];
        const MAX_WRONG = 6;

        let state = {
            words: [],
            currentIndex: 0,
            currentWord: '',
            currentHint: '',
            guessedLetters: [],
            wrongGuesses: 0,
            score: 0,
            wordsWon: 0,
            setTitle: '',
            soundOn: true,
            isLocked: false
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!state.soundOn) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            switch(type) {
                case 'correct':
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                    break;
                case 'wrong':
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                    break;
                case 'win':
                    [523, 659, 784, 1047].forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.1);
                        g.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.2);
                        o.start(audioCtx.currentTime + i * 0.1);
                        o.stop(audioCtx.currentTime + i * 0.1 + 0.2);
                    });
                    break;
                case 'lose':
                    [400, 350, 300, 200].forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.15);
                        g.gain.setValueAtTime(0.15, audioCtx.currentTime + i * 0.15);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.15 + 0.2);
                        o.start(audioCtx.currentTime + i * 0.15);
                        o.stop(audioCtx.currentTime + i * 0.15 + 0.2);
                    });
                    break;
            }
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        async function loadData() {
            let url = DEFAULT_DATA_URL;
            if (dataParam) {
                url = dataParam.startsWith('http') ? dataParam : `words/${dataParam}.json`;
            }

            try {
                const res = await fetch(url);
                const data = await res.json();
                state.words = data.words || data;
                state.setTitle = data.title || 'Hangman';
            } catch (e) {
                state.words = [
                    { word: "elephant", hint: "A large gray animal with a trunk" },
                    { word: "guitar", hint: "A musical instrument with strings" },
                    { word: "sunshine", hint: "Light from the sun" },
                    { word: "butterfly", hint: "A colorful flying insect" },
                    { word: "chocolate", hint: "A sweet brown treat" },
                    { word: "mountain", hint: "A very high landform" },
                    { word: "rainbow", hint: "Colorful arc in the sky after rain" },
                    { word: "penguin", hint: "A black and white bird that can't fly" }
                ];
                state.setTitle = 'Vocabulary';
            }

            document.getElementById('setTitle').textContent = state.setTitle;
            
            // Filter out words longer than 12 characters
            state.words = state.words.filter(w => {
                const word = typeof w === 'string' ? w : w.word;
                return word.length <= 12;
            });
            
            initGame();
        }

        function initGame() {
            state.words = shuffle(state.words);
            state.currentIndex = 0;
            state.score = 0;
            state.wordsWon = 0;
            
            loadWord();
            updateStats();
            hideAllOverlays();
        }

        function loadWord() {
            if (state.currentIndex >= state.words.length) {
                gameComplete();
                return;
            }

            const wordData = state.words[state.currentIndex];
            state.currentWord = (typeof wordData === 'string' ? wordData : wordData.word).toLowerCase();
            state.currentHint = typeof wordData === 'string' ? '' : (wordData.hint || '');
            state.guessedLetters = [];
            state.wrongGuesses = 0;
            state.isLocked = false;

            // Update hint
            const hintBox = document.getElementById('hintBox');
            if (state.currentHint) {
                hintBox.style.display = 'block';
                document.getElementById('hintText').textContent = state.currentHint;
            } else {
                hintBox.style.display = 'none';
            }

            renderWord();
            renderHangman();
            resetKeyboard();
            updateStats();
        }

        function renderWord() {
            const display = document.getElementById('wordDisplay');
            display.innerHTML = '';

            for (const char of state.currentWord) {
                const slot = document.createElement('div');
                slot.className = 'letter-slot';
                
                if (char === ' ') {
                    slot.classList.add('space');
                } else if (state.guessedLetters.includes(char)) {
                    slot.textContent = char;
                    slot.classList.add('revealed');
                }
                
                display.appendChild(slot);
            }
        }

        function renderHangman() {
            HANGMAN_PARTS.forEach((part, index) => {
                const el = document.getElementById(part);
                el.classList.toggle('show', index < state.wrongGuesses);
            });

            // Update face expression based on wrong guesses
            const mouth = document.getElementById('mouth');
            const leftEye = document.getElementById('leftEye');
            const rightEye = document.getElementById('rightEye');

            if (state.wrongGuesses === 0) {
                // Happy face
                mouth.setAttribute('d', 'M122 65 Q130 72 138 65');
                leftEye.setAttribute('r', '3');
                rightEye.setAttribute('r', '3');
            } else if (state.wrongGuesses <= 2) {
                // Slightly worried
                mouth.setAttribute('d', 'M122 67 Q130 67 138 67');
                leftEye.setAttribute('r', '3');
                rightEye.setAttribute('r', '3');
            } else if (state.wrongGuesses <= 4) {
                // Worried
                mouth.setAttribute('d', 'M122 70 Q130 64 138 70');
                leftEye.setAttribute('r', '2');
                rightEye.setAttribute('r', '4');
            } else {
                // Scared! X_X eyes
                leftEye.setAttribute('r', '0');
                rightEye.setAttribute('r', '0');
                mouth.setAttribute('d', 'M122 70 Q130 62 138 70');
                
                // Add X eyes effect by updating innerHTML if at max wrong
                if (state.wrongGuesses >= MAX_WRONG) {
                    leftEye.setAttribute('r', '0');
                    rightEye.setAttribute('r', '0');
                }
            }
        }

        function resetKeyboard() {
            document.querySelectorAll('.key-btn').forEach(btn => {
                btn.disabled = false;
                btn.classList.remove('correct', 'wrong');
            });
        }

        function guessLetter(letter) {
            if (state.isLocked) return;
            if (state.guessedLetters.includes(letter)) return;

            state.guessedLetters.push(letter);
            const btn = document.querySelector(`.key-btn[data-key="${letter}"]`);

            if (state.currentWord.includes(letter)) {
                // Correct guess
                playSound('correct');
                btn.classList.add('correct');
                btn.disabled = true;
                renderWord();

                // Check for win
                if (checkWin()) {
                    state.isLocked = true;
                    const points = (MAX_WRONG - state.wrongGuesses) * 10 + 10;
                    state.score += points;
                    state.wordsWon++;
                    
                    setTimeout(() => {
                        playSound('win');
                        document.getElementById('winWord').textContent = state.currentWord;
                        document.getElementById('winScore').textContent = `+${points}`;
                        document.getElementById('winOverlay').classList.add('show');
                        updateStats();
                    }, 300);
                }
            } else {
                // Wrong guess
                playSound('wrong');
                btn.classList.add('wrong');
                btn.disabled = true;
                state.wrongGuesses++;
                renderHangman();
                updateStats();

                // Check for lose
                if (state.wrongGuesses >= MAX_WRONG) {
                    state.isLocked = true;
                    setTimeout(() => {
                        playSound('lose');
                        document.getElementById('loseWord').textContent = state.currentWord;
                        document.getElementById('loseOverlay').classList.add('show');
                    }, 500);
                }
            }
        }

        function checkWin() {
            for (const char of state.currentWord) {
                if (char !== ' ' && !state.guessedLetters.includes(char)) {
                    return false;
                }
            }
            return true;
        }

        function nextWord() {
            hideAllOverlays();
            state.currentIndex++;
            loadWord();
        }

        function skipWord() {
            state.currentIndex++;
            loadWord();
        }

        function gameComplete() {
            playSound('win');
            document.getElementById('finalScore').textContent = state.score;
            document.getElementById('finalWords').textContent = `${state.wordsWon}/${state.words.length}`;
            document.getElementById('completeOverlay').classList.add('show');
        }

        function updateStats() {
            document.getElementById('score').textContent = state.score;
            document.getElementById('wordsWon').textContent = state.wordsWon;
            document.getElementById('attemptsLeft').textContent = MAX_WRONG - state.wrongGuesses;
        }

        function hideAllOverlays() {
            document.querySelectorAll('.overlay').forEach(o => o.classList.remove('show'));
        }

        // Event Listeners
        document.querySelectorAll('.key-btn').forEach(btn => {
            btn.addEventListener('click', () => guessLetter(btn.dataset.key));
        });

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (/^[a-z]$/.test(key)) {
                guessLetter(key);
            }
        });

        document.getElementById('skipBtn').addEventListener('click', skipWord);
        document.getElementById('nextWordBtn').addEventListener('click', nextWord);
        document.getElementById('tryAgainBtn').addEventListener('click', nextWord);
        document.getElementById('playAgainBtn').addEventListener('click', initGame);
        document.getElementById('soundToggle').addEventListener('click', () => {
            state.soundOn = !state.soundOn;
            document.getElementById('soundToggle').textContent = state.soundOn ? '🔊' : '🔇';
        });

        loadData();
    </script>
</body>
</html>
