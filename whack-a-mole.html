<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole | Speak Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --black: #1a1a1a;
            --black-light: #2a2a2a;
            --orange: #ff6b35;
            --orange-dark: #e55a2b;
            --orange-light: #ff8c5a;
            --white: #ffffff;
            --gray-light: #f5f5f5;
            --gray: #e0e0e0;
            --gray-dark: #888;
            --success: #4caf50;
            --danger: #ef4444;
            --brown: #8B4513;
            --brown-light: #A0522D;
            --brown-dark: #5D3A1A;
            --grass: #4ade80;
            --grass-dark: #22c55e;
            --dirt: #92400e;
            --dirt-light: #b45309;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--black) 0%, var(--black-light) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: var(--white);
        }

        .header { text-align: center; margin-bottom: 15px; }
        .logo { font-size: 0.9rem; font-weight: 700; color: var(--orange); letter-spacing: 3px; text-transform: uppercase; }
        .game-title { font-size: 2rem; font-weight: 800; color: var(--white); }
        .set-title { font-size: 0.9rem; color: var(--gray-dark); margin-top: 5px; }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            width: 100%;
            max-width: 600px;
        }

        .stat-box {
            background: var(--black-light);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .stat-box .value {
            font-family: 'JetBrains Mono', monospace;
            color: var(--orange);
            font-weight: 700;
        }

        /* Timer display */
        .timer-box {
            min-width: 80px;
            justify-content: center;
        }

        .timer-box .value {
            font-size: 1.2rem;
        }

        .timer-box.urgent {
            background: var(--danger);
            border-color: var(--danger);
            animation: pulse 0.5s ease infinite;
        }

        .timer-box.urgent .value {
            color: var(--white);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Prompt Box */
        .prompt-box {
            background: linear-gradient(145deg, var(--orange), var(--orange-dark));
            color: var(--white);
            padding: 15px 30px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .prompt-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .prompt-text {
            font-size: 1.4rem;
            font-weight: 700;
        }

        /* Game Area */
        .game-area {
            background: linear-gradient(180deg, #87CEEB 0%, #87CEEB 40%, var(--grass) 40%, var(--grass-dark) 100%);
            border-radius: 24px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            border: 4px solid var(--orange);
        }

        /* Mole Grid */
        .mole-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            justify-items: center;
        }

        /* Mole Hole */
        .mole-hole {
            width: 100px;
            height: 120px;
            position: relative;
            cursor: pointer;
        }

        .mole-wrapper {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 70px;
            overflow: hidden;
        }

        .hole {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 30px;
            background: var(--dirt);
            border-radius: 50%;
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.3);
            z-index: 2;
        }

        .hole::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 5px;
            right: 5px;
            height: 20px;
            background: var(--brown-dark);
            border-radius: 50%;
            z-index: 1;
        }

        /* Mole */
        .mole {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            width: 70px;
            transition: transform 0.2s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .mole.active {
            transform: translateX(-50%) translateY(0%);
        }

        .mole.whacked {
            transform: translateX(-50%) translateY(100%);
            transition: transform 0.15s ease-in;
        }

        /* Mole Face */
        .mole-face {
            width: 60px;
            height: 55px;
            background: #8B6914;
            border-radius: 50% 50% 45% 45%;
            position: relative;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.2);
        }

        .mole-face::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 14px;
            background: #D2691E;
            border-radius: 50%;
        }

        /* Mole Eyes */
        .mole-eyes {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 18px;
        }

        .mole-eye {
            width: 10px;
            height: 12px;
            background: #1a1a1a;
            border-radius: 50%;
            position: relative;
        }

        .mole-eye::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
        }

        /* Mole Nose */
        .mole-nose {
            position: absolute;
            top: 28px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 10px;
            background: #D2691E;
            border-radius: 50%;
        }

        /* Mole Cheeks */
        .mole-cheeks {
            position: absolute;
            top: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
        }

        .mole-cheek {
            width: 10px;
            height: 6px;
            background: #ffb3b3;
            border-radius: 50%;
            opacity: 0.7;
        }

        /* Mole Teeth */
        .mole-teeth {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 2px;
        }

        .mole-tooth {
            width: 6px;
            height: 8px;
            background: white;
            border-radius: 0 0 3px 3px;
        }

        /* Word Label - floats above the wrapper */
        .mole-label {
            position: absolute;
            bottom: 95px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--white);
            color: var(--black);
            padding: 5px 12px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            white-space: nowrap;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .mole-hole.show-label .mole-label {
            opacity: 1;
        }

        /* Whack Effect */
        .whack-effect {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        .whack-effect.show {
            animation: whackPop 0.4s ease-out;
        }

        @keyframes whackPop {
            0% { opacity: 1; transform: translateX(-50%) translateY(0) scale(0.5); }
            50% { opacity: 1; transform: translateX(-50%) translateY(-20px) scale(1.2); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-40px) scale(1); }
        }

        /* Timer Bar */
        .timer-container {
            margin-top: 20px;
            width: 100%;
        }

        .timer-bar {
            height: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--danger), var(--orange), var(--success));
            border-radius: 10px;
            transition: width 0.1s linear;
            width: 100%;
        }

        .timer-fill.low {
            background: var(--danger);
        }

        /* Buttons */
        .btn-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 28px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary { background: var(--orange); color: var(--white); }
        .btn-primary:hover { background: var(--orange-dark); transform: translateY(-2px); }
        .btn-secondary { background: var(--white); color: var(--black); }
        .btn-secondary:hover { background: var(--gray); }

        /* Overlays */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .overlay.show { opacity: 1; pointer-events: all; }

        .modal {
            background: var(--white);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            max-width: 400px;
            width: 100%;
        }

        .overlay.show .modal { transform: scale(1); }

        .modal-icon { font-size: 3.5rem; margin-bottom: 15px; }
        .modal-title { font-size: 1.6rem; color: var(--black); margin-bottom: 10px; font-weight: 700; }
        .modal-subtitle { color: var(--gray-dark); margin-bottom: 20px; }

        .modal-stats { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
        .modal-stat { text-align: center; }
        .modal-stat-value { font-size: 1.5rem; font-weight: 700; color: var(--orange); }
        .modal-stat-label { font-size: 0.8rem; color: var(--gray-dark); }

        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--white);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 50;
        }

        /* Countdown */
        .countdown-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .countdown-overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .countdown-number {
            font-size: 8rem;
            font-weight: 800;
            color: var(--white);
            text-shadow: 0 0 40px var(--orange);
            animation: countPulse 0.5s ease-out;
        }

        .countdown-number.go {
            color: var(--orange);
            font-size: 5rem;
        }

        @keyframes countPulse {
            0% { transform: scale(1.5); opacity: 0; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 1; }
        }

        @media (max-width: 500px) {
            .game-title { font-size: 1.6rem; }
            .game-area { padding: 20px; }
            .mole-grid { gap: 10px; }
            .mole-hole { width: 90px; height: 110px; }
            .mole-wrapper { width: 75px; height: 60px; }
            .hole { width: 70px; height: 22px; }
            .mole { width: 50px; }
            .mole-face { width: 45px; height: 40px; }
            .mole-label { font-size: 0.6rem; padding: 3px 8px; bottom: 85px; }
            .stat-box { padding: 8px 12px; font-size: 0.8rem; }
            .prompt-text { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <button class="sound-toggle" id="soundToggle">🔊</button>

    <header class="header">
        <div class="logo">Speak Academy</div>
        <h1 class="game-title">Whack-a-Mole</h1>
        <p class="set-title" id="setTitle">Loading...</p>
    </header>

    <div class="stats-bar">
        <div class="stat-box timer-box" id="timerBox">
            <span>⏱️</span>
            <span class="value" id="timerDisplay">60</span>
        </div>
        <div class="stat-box">
            <span>⭐</span>
            <span>Score:</span>
            <span class="value" id="score">0</span>
        </div>
        <div class="stat-box">
            <span>✅</span>
            <span>Hits:</span>
            <span class="value" id="hits">0</span>
        </div>
        <div class="stat-box">
            <span>❌</span>
            <span>Misses:</span>
            <span class="value" id="misses">0</span>
        </div>
    </div>

    <div class="prompt-box">
        <div class="prompt-label">Whack the mole with:</div>
        <div class="prompt-text" id="promptText">Get Ready!</div>
    </div>

    <div class="game-area">
        <div class="mole-grid" id="moleGrid">
            <!-- 9 Mole Holes -->
        </div>

        <div class="timer-container">
            <div class="timer-bar">
                <div class="timer-fill" id="timerFill"></div>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn btn-secondary" id="startBtn">▶️ Start Game</button>
        </div>
    </div>

    <!-- Start Modal -->
    <div class="overlay show" id="startOverlay">
        <div class="modal">
            <div class="modal-icon">🐹</div>
            <h2 class="modal-title">Whack-a-Mole!</h2>
            <p class="modal-subtitle">Whack the mole showing the correct answer.<br>Be quick, they won't wait!</p>
            <button class="btn btn-primary" id="playBtn">▶️ Start Game</button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div class="overlay" id="gameOverOverlay">
        <div class="modal">
            <div class="modal-icon">🏆</div>
            <h2 class="modal-title">Time's Up!</h2>
            <div class="modal-stats">
                <div class="modal-stat">
                    <div class="modal-stat-value" id="finalScore">0</div>
                    <div class="modal-stat-label">Score</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-value" id="finalHits">0</div>
                    <div class="modal-stat-label">Hits</div>
                </div>
                <div class="modal-stat">
                    <div class="modal-stat-value" id="finalAccuracy">0%</div>
                    <div class="modal-stat-label">Accuracy</div>
                </div>
            </div>
            <button class="btn btn-primary" id="playAgainBtn">🔄 Play Again</button>
        </div>
    </div>

    <!-- Countdown Overlay -->
    <div class="countdown-overlay" id="countdownOverlay">
        <div class="countdown-number" id="countdownNumber">3</div>
    </div>

    <script>
        const DEFAULT_DATA_URL = 'words/whack-a-mole.json';
        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('data') || urlParams.get('set');

        const GAME_DURATION = 60; // seconds
        const MOLE_SHOW_TIME = 3000; // ms - how long moles stay up
        const MOLE_INTERVAL = 3500; // ms between new mole sets (only if correct was hit)

        let state = {
            pairs: [],
            shuffledPairs: [],
            currentPairIndex: 0,
            currentTarget: null,
            activeMoles: [],
            currentHoles: [],
            score: 0,
            hits: 0,
            misses: 0,
            totalAttempts: 0,
            timeLeft: GAME_DURATION,
            gameRunning: false,
            gameTimer: null,
            moleTimer: null,
            hideTimer: null,
            waitingForCorrect: false,
            setTitle: '',
            soundOn: true
        };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!state.soundOn) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            switch(type) {
                case 'whack':
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                    break;
                case 'correct':
                    [523, 659, 784].forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.08);
                        g.gain.setValueAtTime(0.12, audioCtx.currentTime + i * 0.08);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.08 + 0.15);
                        o.start(audioCtx.currentTime + i * 0.08);
                        o.stop(audioCtx.currentTime + i * 0.08 + 0.15);
                    });
                    break;
                case 'wrong':
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                    break;
                case 'pop':
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.05);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
                    break;
                case 'countdown':
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                    break;
                case 'go':
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                    break;
                case 'tick':
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.08);
                    break;
                case 'hurry':
                    // Urgent beep-beep
                    [800, 1000].forEach((f, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.type = 'square';
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.1);
                        g.gain.setValueAtTime(0.12, audioCtx.currentTime + i * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.08);
                        o.start(audioCtx.currentTime + i * 0.1);
                        o.stop(audioCtx.currentTime + i * 0.1 + 0.08);
                    });
                    break;
            }
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        async function loadData() {
            let url = DEFAULT_DATA_URL;
            if (dataParam) {
                url = dataParam.startsWith('http') ? dataParam : `words/${dataParam}.json`;
            }

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('Failed to load');
                const data = await res.json();
                state.pairs = data.pairs || data;
                state.setTitle = data.title || 'Whack-a-Mole';
                console.log('Loaded', state.pairs.length, 'pairs from', url);
            } catch (e) {
                console.warn('Could not load JSON, using fallback:', e);
                state.pairs = [
                    { prompt: "Hello", answer: "Hola" },
                    { prompt: "Goodbye", answer: "Adiós" },
                    { prompt: "Thank you", answer: "Gracias" },
                    { prompt: "Please", answer: "Por favor" },
                    { prompt: "Yes", answer: "Sí" },
                    { prompt: "No", answer: "No" },
                    { prompt: "Good morning", answer: "Buenos días" },
                    { prompt: "Good night", answer: "Buenas noches" },
                    { prompt: "Water", answer: "Agua" },
                    { prompt: "Food", answer: "Comida" }
                ];
                state.setTitle = 'English - Spanish';
            }

            document.getElementById('setTitle').textContent = state.setTitle;
            createMoleHoles();
        }

        function createMoleHoles() {
            const grid = document.getElementById('moleGrid');
            grid.innerHTML = '';

            for (let i = 0; i < 9; i++) {
                const hole = document.createElement('div');
                hole.className = 'mole-hole';
                hole.id = `hole-${i}`;
                hole.dataset.index = i;
                hole.innerHTML = `
                    <div class="mole-label" id="label-${i}"></div>
                    <div class="mole-wrapper">
                        <div class="mole" id="mole-${i}">
                            <div class="mole-face">
                                <div class="mole-eyes">
                                    <div class="mole-eye"></div>
                                    <div class="mole-eye"></div>
                                </div>
                                <div class="mole-nose"></div>
                                <div class="mole-cheeks">
                                    <div class="mole-cheek"></div>
                                    <div class="mole-cheek"></div>
                                </div>
                                <div class="mole-teeth">
                                    <div class="mole-tooth"></div>
                                    <div class="mole-tooth"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="hole"></div>
                    <div class="whack-effect" id="effect-${i}">💥</div>
                `;

                hole.addEventListener('click', () => whackMole(i));
                grid.appendChild(hole);
            }
        }

        function startGame() {
            hideAllOverlays();
            showCountdown();
        }

        function showCountdown() {
            const overlay = document.getElementById('countdownOverlay');
            const numberEl = document.getElementById('countdownNumber');
            
            overlay.classList.add('show');
            let count = 3;
            
            function updateCount() {
                if (count > 0) {
                    numberEl.textContent = count;
                    numberEl.classList.remove('go');
                    // Re-trigger animation
                    numberEl.style.animation = 'none';
                    void numberEl.offsetWidth;
                    numberEl.style.animation = 'countPulse 0.5s ease-out';
                    playSound('countdown');
                    count--;
                    setTimeout(updateCount, 800);
                } else {
                    numberEl.textContent = 'GO!';
                    numberEl.classList.add('go');
                    numberEl.style.animation = 'none';
                    void numberEl.offsetWidth;
                    numberEl.style.animation = 'countPulse 0.5s ease-out';
                    playSound('go');
                    
                    setTimeout(() => {
                        overlay.classList.remove('show');
                        beginGame();
                    }, 600);
                }
            }
            
            updateCount();
        }

        function beginGame() {
            state.score = 0;
            state.hits = 0;
            state.misses = 0;
            state.totalAttempts = 0;
            state.timeLeft = GAME_DURATION;
            state.gameRunning = true;
            state.activeMoles = [];
            state.waitingForCorrect = false;
            
            // Shuffle pairs and start from beginning
            state.shuffledPairs = shuffle([...state.pairs]);
            state.currentPairIndex = 0;

            // Reset timer display
            document.getElementById('timerDisplay').textContent = GAME_DURATION;
            document.getElementById('timerBox').classList.remove('urgent');
            
            // Reset timer bar
            document.getElementById('timerFill').style.width = '100%';
            document.getElementById('timerFill').classList.remove('low');

            updateStats();
            
            // Start game timer
            state.gameTimer = setInterval(updateGameTimer, 1000);

            // Show first set of moles
            showNewRound();
        }

        function showNewRound() {
            if (!state.gameRunning) return;
            
            selectNewTarget();
            showRandomMoles();
            state.waitingForCorrect = true;
        }

        function selectNewTarget() {
            // If we've gone through all pairs, reshuffle
            if (state.currentPairIndex >= state.shuffledPairs.length) {
                state.shuffledPairs = shuffle([...state.pairs]);
                state.currentPairIndex = 0;
            }
            
            const pair = state.shuffledPairs[state.currentPairIndex];
            state.currentTarget = pair;
            state.currentPairIndex++;
            document.getElementById('promptText').textContent = pair.prompt;
        }

        function showRandomMoles() {
            if (!state.gameRunning) return;

            // Hide all moles and labels first
            for (let i = 0; i < 9; i++) {
                const mole = document.getElementById(`mole-${i}`);
                const hole = document.getElementById(`hole-${i}`);
                mole.classList.remove('active');
                hole.classList.remove('show-label');
            }

            // Select 3-4 random holes
            const numMoles = Math.floor(Math.random() * 2) + 3;
            const holes = shuffle([0, 1, 2, 3, 4, 5, 6, 7, 8]).slice(0, numMoles);

            // Get random wrong answers (different from correct answer)
            const wrongAnswers = state.pairs
                .filter(p => p.answer !== state.currentTarget.answer)
                .map(p => p.answer);
            const shuffledWrong = shuffle(wrongAnswers);

            // Decide which hole gets the correct answer
            const correctHole = holes[Math.floor(Math.random() * holes.length)];

            state.activeMoles = [];
            state.currentHoles = holes;
            let wrongIndex = 0;

            holes.forEach((holeIndex) => {
                const mole = document.getElementById(`mole-${holeIndex}`);
                const hole = document.getElementById(`hole-${holeIndex}`);
                const label = document.getElementById(`label-${holeIndex}`);

                let answer;
                if (holeIndex === correctHole) {
                    answer = state.currentTarget.answer;
                    state.activeMoles.push({ index: holeIndex, isCorrect: true, answer: answer });
                } else {
                    answer = shuffledWrong[wrongIndex % shuffledWrong.length];
                    wrongIndex++;
                    state.activeMoles.push({ index: holeIndex, isCorrect: false, answer: answer });
                }

                label.textContent = answer;
                
                // Pop up with slight stagger
                setTimeout(() => {
                    if (state.gameRunning) {
                        mole.classList.add('active');
                        hole.classList.add('show-label');
                        playSound('pop');
                    }
                }, Math.random() * 150);
            });

            // Auto-hide after timeout if not whacked - then show new moles
            if (state.hideTimer) clearTimeout(state.hideTimer);
            state.hideTimer = setTimeout(() => {
                if (state.gameRunning) {
                    // Hide current moles
                    holes.forEach(holeIndex => {
                        const mole = document.getElementById(`mole-${holeIndex}`);
                        const hole = document.getElementById(`hole-${holeIndex}`);
                        mole.classList.remove('active');
                        hole.classList.remove('show-label');
                    });
                    // Show new set after brief pause
                    setTimeout(() => {
                        if (state.gameRunning) {
                            showNewRound();
                        }
                    }, 400);
                }
            }, MOLE_SHOW_TIME);
        }

        function whackMole(index) {
            if (!state.gameRunning) return;

            const mole = document.getElementById(`mole-${index}`);
            const hole = document.getElementById(`hole-${index}`);
            const effect = document.getElementById(`effect-${index}`);

            if (!mole.classList.contains('active')) return;

            state.totalAttempts++;
            const moleData = state.activeMoles.find(m => m.index === index);

            playSound('whack');
            
            // Whack animation
            mole.classList.remove('active');
            mole.classList.add('whacked');
            hole.classList.remove('show-label');
            setTimeout(() => mole.classList.remove('whacked'), 200);

            // Show effect
            effect.classList.remove('show');
            void effect.offsetWidth;

            if (moleData && moleData.isCorrect) {
                // Correct! 
                effect.textContent = '⭐';
                effect.classList.add('show');
                playSound('correct');
                state.score += 10;
                state.hits++;
                updateStats();

                // Clear the auto-hide timer
                if (state.hideTimer) clearTimeout(state.hideTimer);

                // Hide all remaining moles and show new round
                setTimeout(() => {
                    for (let i = 0; i < 9; i++) {
                        document.getElementById(`mole-${i}`).classList.remove('active');
                        document.getElementById(`hole-${i}`).classList.remove('show-label');
                    }
                    setTimeout(() => {
                        if (state.gameRunning) {
                            showNewRound();
                        }
                    }, 300);
                }, 200);

            } else {
                // Wrong! Just remove that mole, others stay
                effect.textContent = '❌';
                effect.classList.add('show');
                playSound('wrong');
                state.misses++;
                state.score = Math.max(0, state.score - 5);
                updateStats();

                // Remove this mole from active list
                state.activeMoles = state.activeMoles.filter(m => m.index !== index);
            }
        }

        function updateGameTimer() {
            state.timeLeft--;
            
            // Update timer display
            const timerDisplay = document.getElementById('timerDisplay');
            const timerBox = document.getElementById('timerBox');
            timerDisplay.textContent = state.timeLeft;
            
            // Update progress bar
            const pct = (state.timeLeft / GAME_DURATION) * 100;
            const timerFill = document.getElementById('timerFill');
            timerFill.style.width = `${pct}%`;

            if (pct < 20) {
                timerFill.classList.add('low');
            } else {
                timerFill.classList.remove('low');
            }

            // Last 5 seconds - urgent mode
            if (state.timeLeft <= 5 && state.timeLeft > 0) {
                timerBox.classList.add('urgent');
                playSound('hurry');
            } else {
                timerBox.classList.remove('urgent');
            }

            if (state.timeLeft <= 0) {
                timerBox.classList.remove('urgent');
                endGame();
            }
        }

        function endGame() {
            state.gameRunning = false;
            clearInterval(state.gameTimer);
            if (state.moleTimer) clearInterval(state.moleTimer);
            if (state.hideTimer) clearTimeout(state.hideTimer);

            // Hide all moles and labels
            for (let i = 0; i < 9; i++) {
                document.getElementById(`mole-${i}`).classList.remove('active');
                document.getElementById(`hole-${i}`).classList.remove('show-label');
            }

            const accuracy = state.totalAttempts > 0 
                ? Math.round((state.hits / state.totalAttempts) * 100) 
                : 0;

            document.getElementById('finalScore').textContent = state.score;
            document.getElementById('finalHits').textContent = state.hits;
            document.getElementById('finalAccuracy').textContent = `${accuracy}%`;

            document.getElementById('gameOverOverlay').classList.add('show');
        }

        function updateStats() {
            document.getElementById('score').textContent = state.score;
            document.getElementById('hits').textContent = state.hits;
            document.getElementById('misses').textContent = state.misses;
        }

        function hideAllOverlays() {
            document.querySelectorAll('.overlay').forEach(o => o.classList.remove('show'));
        }

        // Event Listeners
        document.getElementById('playBtn').addEventListener('click', startGame);
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('playAgainBtn').addEventListener('click', startGame);
        document.getElementById('soundToggle').addEventListener('click', () => {
            state.soundOn = !state.soundOn;
            document.getElementById('soundToggle').textContent = state.soundOn ? '🔊' : '🔇';
        });

        loadData();
    </script>
</body>
</html>
